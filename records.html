<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的记录 · 四级冲刺</title>
<style>
:root{ --bg:#f4f5f7; --card:#ffffff; --soft:#fafbfc;
 --line:#e5e8ec; --line2:#eff1f4;
 --txt:#1b1e23; --txt2:#2b303a; --sub:#6b7280; --sub2:#a8b0bb;
 --blue:#2563eb; --blue-soft:#eef3ff; --green:#0d8a52; --green-soft:#e8f7ef;
 --red:#c0392b; --red-soft:#fdecea; --amber:#b45309; --amber-soft:#fef6e7;
 --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05); }
@media (prefers-color-scheme: dark){
 :root{ --bg:#101216; --card:#181b20; --soft:#20242a;
  --line:#272c33; --line2:#22262c;
  --txt:#e9ebee; --txt2:#d5d9de; --sub:#98a0aa; --sub2:#6b7280;
  --blue:#6b96fb; --blue-soft:#1b2536; --green:#4ec98a; --green-soft:#152a20;
  --red:#f0776a; --red-soft:#2c1a18; --amber:#e3a54a; --amber-soft:#2b2317;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 60px;background:var(--bg);color:var(--txt);
 font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
 max-width:820px;margin-left:auto;margin-right:auto}
.lede{font-size:12.5px;line-height:1.6;color:var(--sub);margin:-6px 0 14px}
.back{display:inline-block;margin-bottom:12px;color:var(--blue);text-decoration:none;font-size:14px;font-weight:600}
h1{font-size:22px;margin:0 0 16px;letter-spacing:-.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.chead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.chead h2{font-size:16px;margin:0}
.cmeta{font-size:12.5px;color:var(--sub)}
.day{font-size:12.5px;font-weight:800;color:var(--sub);margin:16px 0 8px;letter-spacing:.5px}
.day:first-child{margin-top:0}
.it{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--soft)}
.it .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;flex:0 0 auto;background:var(--blue-soft);color:var(--blue)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.it .tt{font-size:13.5px;font-weight:700;color:var(--txt2)}
.it .bd{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--txt2);
 font-variant-numeric:tabular-nums;margin-top:9px}
/* 回执默认折叠：20 条整段文本会把页面撑到 12 屏，摘要一行就够扫 */
.it>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;margin:0}
.it>summary::-webkit-details-marker{display:none}
.it>summary .tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it>summary .res{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--sub);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.it>summary .res.bad{color:var(--red)} .it>summary .res.ok{color:var(--green)}
.it>summary::after{content:'▾';flex:0 0 auto;color:var(--sub2);font-size:11.5px;transition:.15s}
.it[open]>summary::after{content:'▴'}
.it[open]>summary{margin-bottom:2px}
.it .bd .ln{display:block}
.it .bd .ln.bad{color:var(--red);font-weight:600}
.it .bd .ln.ok{color:var(--sub2)}
.coach{border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;
 padding:11px 13px;margin-top:9px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;
 color:var(--txt2);word-break:break-word}
.coach b{color:var(--green)}
.empty{color:var(--sub);font-size:12.5px;text-align:center;padding:14px 0;line-height:1.6}
.tip{background:var(--blue-soft);color:var(--blue);border-radius:11px;padding:11px 14px;
 font-size:13px;line-height:1.75;margin-bottom:14px}
.kb{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
.kb-l{display:flex;align-items:baseline;gap:8px;min-width:0}
.kb-l b{font-size:13.5px;color:var(--txt)}
.kb-sub{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.kb-r{display:flex;align-items:baseline;gap:7px;flex:0 0 auto}
.kb-pct{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1}
.kb-pct.ok{color:var(--green)} .kb-pct.mid{color:var(--amber)} .kb-pct.bad{color:var(--red)}
.kb-last{font-size:11.5px;color:var(--sub2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kb-up{font-style:normal;color:var(--green)} .kb-dn{font-style:normal;color:var(--red)}
.kb-bar{height:8px;border-radius:6px;background:var(--track);overflow:hidden;margin-bottom:15px}
.kb-bar i{display:block;height:100%;border-radius:5px}
.kb-bar i.ok{background:var(--green)} .kb-bar i.mid{background:var(--amber)} .kb-bar i.bad{background:var(--red)}
.wbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.wbar .nm{flex:0 0 76px;color:var(--txt2);font-weight:600}
.wbar .tr{flex:1;height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.wbar .tr i{display:block;height:100%;border-radius:5px}
.wchip{display:inline-block;background:var(--red-soft);color:var(--red);border-radius:7px;
 padding:3px 9px;font-size:12.5px;font-weight:600;margin:0 5px 5px 0}
.wchip.more{background:var(--line2);color:var(--sub)}
.wbar .n{flex:0 0 30px;text-align:right;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}

  /* VIS_V1_START ═══ 视觉改版 v1（2026-11-12）：与首页、精听页、整套页同一套取值 ═══
     只覆盖变量、卡片外观、和暗色下失效的实心按钮；不动结构、不改内边距。要回退删掉本块。 */
  :root{
    --bg:#f6f6f4; --soft:#fafaf9; --grey:#f1f1ef;
    --line:#e8e8e5; --line2:#f1f1ee; --track:#e9e9e6;
    --txt:#16161a; --txt2:#242429; --txt3:#3c3c44; --sub:#6d6d76; --sub2:#7b8491;
    --blue:#3355d1; --blue-soft:#eef1fd;
    --green:#0b6b41; --green-soft:#e9f6ee;
    --red:#b8332a; --red-soft:#fceeec;
    --amber:#9a5109; --amber-soft:#fdf5e7; --amber-line:#eedeba; --green-line:#bfe3cf;
    --shadow:0 1px 2px rgba(22,22,26,.04);
    --shadow-lg:0 20px 44px -24px rgba(22,22,26,.28);
  }
  body{font-family:"MiSans VF",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  .card{border:0;border-radius:18px;
    box-shadow:0 1px 2px rgba(22,22,26,.04),0 14px 34px -26px rgba(22,22,26,.35);}
  /* 解析块原来写死 #fff，暗色下会变成一块白板 */
  .ana{background:var(--card);}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1115;--card:#171a1f;--soft:#1d2026;--grey:#20242a;
      --line:#282d35;--line2:#22262d;--track:#272c34;
      --txt:#e8eaee;--txt2:#d5d8dd;--txt3:#bfc4cb;--sub:#98a0aa;--sub2:#98a0aa;
      --blue:#7a97ff;--blue-soft:#1a2340;--green:#43cf92;--green-soft:#122e1f;
      --red:#ef7a6b;--red-soft:#341d19;--amber:#e0a53f;--amber-soft:#302612;
      --amber-line:#463619;--shadow:none;--shadow-lg:none;}
    .card{border:1px solid rgba(255,255,255,.055);box-shadow:none;}
    /* 亮蓝底配白字只有 2.7:1，改深底保留白字（与 section.css 同一处理） */
    .tab.on,.tbtn2.on,.pno,.submit,.lbl,.prompt .lbl,.wbtn.primary,#cloudPhoto,.qno,
    a.go,.go,.lnk,.btnp,.btn-primary,.btn-copy{
      background:#2f4f9e;border-color:#2f4f9e;color:#fff;}
    /* 圆形序号用 --txt 当底色，暗色下变成白底白字 */
    h2 .num,.num{background:#2f4f9e;color:#fff;}
    /* 这几类按钮写死了 #fff，暗色下是白底浅灰字 */
    .sbtn,.tbtn,.pbtn,.opt,.cchip,.btn-ghost{
      background:var(--soft);border-color:var(--line);color:var(--txt2);}
    /* .tip 写死了深蓝字，暗色下压在深蓝底上只剩 1.4:1 */
    .tip{color:#b9cdf5;}
    /* 连读标注的亮黄底在暗色页面里是一块刺眼的高光，压成暗琥珀 */
    body.mk .w.mk{background:#4a3f16;color:#ffe89a;}
    /* 提示卡里的琥珀色粗体在暗色下只剩 2.5:1 */
    .tip b{color:#e8b665;}
  }
  /* VIS_V1_END */
</style>

<body>
<a class="back" href="index.html">← 返回作战台</a>
<h1>我的记录</h1>

<p class="lede">听力 / 阅读判分后自动上云，写译点「发给我批改」后上云。教练的批改追加在回执里。</p>


<div class="card" id="setCard" style="display:none">
  <div class="chead"><h2>整套听力</h2><span class="cmeta" id="setMeta"></span></div>
  <div id="setList"></div>
  <p style="font-size:12.5px;color:var(--sub);margin:10px 0 0;line-height:1.7">
    整套连做在本机记分，和单段回执分开算。第二轮同一个音频再听一遍，<b>分数差</b>才是长进。
  </p>
</div>

<div class="card" id="wordCard" style="display:none">
  <div class="chead"><h2>听词卡壳</h2><span class="cmeta" id="wordMeta"></span></div>
  <div id="wordList"></div>
</div>

<div class="card" id="whyCard" style="display:none">
  <div class="chead"><h2>错因分布</h2><span class="cmeta" id="whyMeta"></span></div>
  <div id="whyBars"></div>
  <div class="tip" id="whyInsight" style="margin:12px 0 0;display:none"></div>
</div>

<div class="card" id="kindCard" style="display:none">
  <div class="chead"><h2>各科正确率</h2><span class="cmeta" id="kindMeta"></span></div>
  <div id="kindBars"></div>
  <div class="tip" id="kindTip" style="margin:12px 0 0;display:none"></div>
</div>

<div class="card">
  <div class="chead"><h2>错题本</h2><span class="cmeta" id="wcnt">0 题</span></div>
  <div id="wrongList"><div class="empty">判分后错题会自动收进这里；听写没听清的句子也会进来。</div></div>
</div>

<div class="card">
  <div class="chead"><h2>进度备份</h2><span class="cmeta" id="bkMeta">读取中…</span></div>
  <div id="bkBody">
    <p style="font-size:13px;color:var(--sub);margin:0 0 11px;line-height:1.7">
      进度只存在这台设备上。换手机、清浏览器数据、用无痕模式都会归零——考前导一份存微信里。
    </p>
    <div style="display:flex;gap:9px">
      <button id="expBtn" style="flex:1;padding:11px 8px;border-radius:10px;border:1.5px solid var(--blue);
        background:var(--blue-soft);color:var(--blue);font:700 13px/1 inherit;cursor:pointer">导出进度</button>
      <button id="impBtn" style="flex:1;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);
        background:var(--card);color:var(--sub);font:700 13px/1 inherit;cursor:pointer">导入进度</button>
    </div>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
  </div>
</div>

<div class="card">
  <div class="chead"><h2>回执与批改</h2><span class="cmeta" id="cnt">加载中…</span></div>
  <div id="list"><div class="empty">正在拉取云端记录…</div></div>
</div>

<script>
var TOPIC = 'cet4-718beb5773e8edd9ef48eb651cb1439dd362eb4a8d28f449';
var KIND = {listening:'听力', reading:'阅读', writing:'写作', translation:'翻译'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* 历史档案（records.json，永久）+ ntfy 实时，合并去重 */
Promise.all([
  fetch('records.json?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1&since=all')
    .then(function(r){ return r.text(); }).catch(function(){ return ''; })
]).then(function(res){
  var arch = res[0] || {};
  /* 无效回执：刷新后选项丢失、点了提交 → 「我选 undefined / 0 分」；或一题没答的空提交 */
  function badRep(p){
    var t = String(p.text || '');
    if (/undefined/i.test(t)) return true;
    var s = String(repScore(p) || '');
    if (/^0\//.test(s) && t.indexOf('✔') < 0){
      var un = (t.match(/未答/g) || []).length, tot = parseInt(s.split('/')[1] || '0', 10);
      if (un && un >= tot) return true;
    }
    return false;
  }
  var recs = (arch.reps || []).filter(function(r){ return !badRep(r); });
  var coaches = (arch.coaches || []).slice();
  var photos = (arch.photos || []).slice();
  var wbs = [];

  function repScore(p){
    var s = p.score;
    if (!s){
      var m = String(p.text || '').match(/结果：(\d+\/\d+)/);
      s = m ? m[1] : '';
    }
    return s;
  }
  var repKeys = {}, coachKeys = {}, photoKeys = {};
  recs.forEach(function(r){ repKeys[(r.date||'')+'|'+(r.kind||'')+'|'+(r.page||'')+'|'+(r.score||'')] = 1; });
  coaches.forEach(function(c){ coachKeys[(c.date||'')+'|'+(c.kind||'')+'|'+(c.text||'')] = 1; });
  photos.forEach(function(p){ photoKeys[p.name||''] = 1; });

  String(res[1] || '').trim().split('\n').forEach(function(line){
    if (!line.trim()) return;
    var m; try{ m = JSON.parse(line); }catch(e){ return; }
    var p; try{ p = JSON.parse(m.message); }catch(e){ return; }
    if (!p || !p.t) return;
    if (p.t === 'rep'){
      if (badRep(p)) return;
      var k = (p.date||'')+'|'+(p.kind||'')+'|'+(p.page||'')+'|'+repScore(p);
      if (!repKeys[k]) { recs.push(p); repKeys[k] = 1; }
    } else if (p.t === 'coach'){
      var k2 = (p.date||'')+'|'+(p.kind||'')+'|'+(p.text||'');
      if (!coachKeys[k2]) { coaches.push(p); coachKeys[k2] = 1; }
    } else if (p.t === 'photo'){
      var att = m.attachment || {};
      var name = att.name || '';
      if (name && !photoKeys[name]) { photos.push(p); photoKeys[name] = 1; }
    } else if (p.t === 'wrongbook'){
      wbs.push(p);
    }
  });

  render(recs, coaches, photos);
  renderKinds(recs);
  renderWrongbook(wbs);
}).catch(function(){
  document.getElementById('list').innerHTML = '<div class="empty">拉取失败 —— 检查网络后刷新本页。</div>';
});

/* ── 各科正确率：按 kind 聚合，同一天同一页只算最后一次 ── */
function renderKinds(recs){
  var NAME = {listening:'听力', reading:'仔细阅读', matching:'长篇匹配', writing:'写作', translation:'翻译'};
  var g = {}, order = ['listening','reading','matching','writing','translation'];
  recs.forEach(function(r){
    if (r.excluded) return;                 /* 演练 / 误触产生的回执，不计入正确率 */
    var sc = r.score || (String(r.text || '').match(/结果：(\d+\/\d+)/) || [])[1] || '';
    var m = String(sc).match(/(\d+)\s*\/\s*(\d+)/);
    if (!m) return;
    var k = r.kind || 'listening';
    /* 同一天同一页可能有两篇（P1/P2），分数不同要分开算；同分重复提交才去重 */
    var key = (r.date || '') + '|' + k + '|' + (r.page || '') + '|' + String(sc);
    g[k] = g[k] || {};
    g[k][key] = {r: parseInt(m[1],10), t: parseInt(m[2],10), date: (r.date || '')};
  });
  var rows = [];
  order.forEach(function(k){
    var o = g[k]; if (!o) return;
    var keys = Object.keys(o); if (!keys.length) return;
    keys.sort(function(a,b){ return String(o[a].date).localeCompare(String(o[b].date)); });
    var R = 0, T = 0, n = 0;
    keys.forEach(function(x){ R += o[x].r; T += o[x].t; n++; });
    var pct = T ? Math.round(R / T * 100) : 0;
    var first = o[keys[0]], last = o[keys[n-1]];
    var fp = first.t ? Math.round(first.r / first.t * 100) : 0;
    var lp = last.t ? Math.round(last.r / last.t * 100) : 0;
    rows.push({k:k, label:NAME[k] || k, n:n, R:R, T:T, pct:pct, fp:fp, lp:lp});
  });
  var card = document.getElementById('kindCard');
  if (!rows.length){ card.style.display = 'none'; return; }
  card.style.display = '';
  var total = rows.reduce(function(a,x){ return a + x.n; }, 0);
  var exN = recs.filter(function(x){ return x.excluded; }).length;
  document.getElementById('kindMeta').textContent = total + ' 次判分' + (exN ? '（另 ' + exN + ' 条存疑未计入）' : '');
  document.getElementById('kindBars').innerHTML = rows.map(function(x){
    var tone = x.pct >= 60 ? 'ok' : (x.pct >= 40 ? 'mid' : 'bad');
    /* 以前 22% 只加粗，夹在「14 次 · 27/123 · ... 最近 30% ↓」里读不出重点。
       现在拆成左「科目 + 次数/题数」右「大号百分比 + 变化」，百分比单独占视觉重量。 */
    var arrow = x.n > 1
      ? (x.lp >= x.fp ? '<i class="kb-up">↑</i>' : '<i class="kb-dn">↓</i>')
      : '';
    return '<div class="kb">'
      +   '<div class="kb-l"><b>' + x.label + '</b>'
      +     '<span class="kb-sub">' + x.n + ' 次 · ' + x.R + '/' + x.T + '</span></div>'
      +   '<div class="kb-r"><b class="kb-pct ' + tone + '">' + x.pct + '%</b>'
      +     '<span class="kb-last">最近 ' + x.lp + '%' + arrow + '</span></div>'
      + '</div>'
      + '<div class="kb-bar"><i class="' + tone + '" style="width:' + Math.max(x.pct,2) + '%"></i></div>';
  }).join('');
  var l = rows.filter(function(x){ return x.k === 'listening'; })[0];
  var rd = rows.filter(function(x){ return x.k === 'reading' || x.k === 'matching'; });
  var tips = [];
  if (l) tips.push('听力 ' + l.pct + '%（阶段目标：单段篇章 ≥50% 且留白≤5 句，整套连做 ≥45%）。');
  if (!rd.length) tips.push('阅读还没有任何判分记录 —— 做了但没点提交，或者还没开始。');
  else {
    var rp = Math.round(rd.reduce(function(a,x){ return a + x.R; },0) / Math.max(1, rd.reduce(function(a,x){ return a + x.T; },0)) * 100);
    tips.push('阅读合计 ' + rp + '%（阶段目标：仔细阅读 ≥82%，长篇匹配 ≥85%）。');
  }
  var tip = document.getElementById('kindTip');
  tip.style.display = '';
  tip.innerHTML = tips.join('<br>');
}

function render(recs, coaches, photos){
  var items = [];
  /* 同一 date+kind+page 的重复回执只保留最后一条（防多次点击重复上云） */
  var rmap = {}, hasRep = {};
  recs.forEach(function(r){
    var key = (r.date || '') + '|' + (r.kind || 'listening') + '|' + (r.page || '');
    rmap[key] = r;
  });
  Object.keys(rmap).forEach(function(key){
    var r = rmap[key];
    hasRep[(r.date || '') + '|' + (r.kind || 'listening')] = true;
    items.push({ type:'rep', date:r.date, kind:(r.kind || 'listening'), page:r.page, rep:r });
  });
  /* 手写照片也单独成条（写作/翻译常常只传照片、没有文本回执） */
  var pmap = {};
  (photos || []).forEach(function(p){
    var key = (p.date || '') + '|' + (p.kind || '') + '|' + (p.page || '');
    if (!pmap[key]) pmap[key] = { type:'photo', date:p.date, kind:(p.kind || 'listening'), page:p.page, n:0 };
    pmap[key].n++;
  });
  Object.keys(pmap).forEach(function(k){ items.push(pmap[k]); });

  if (!items.length){
    document.getElementById('cnt').textContent = '0 条';
    document.getElementById('list').innerHTML =
      '<div class="empty">还没有回执或照片。做完一套听力/阅读，或上传手写照后会自动出现在这里。</div>';
    return;
  }
  items.sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
  var byDay = {};
  items.forEach(function(it){ (byDay[it.date] = byDay[it.date] || []).push(it); });
  var days = Object.keys(byDay).sort().reverse();
  var html = '';
  days.forEach(function(d){
    html += '<div class="day">' + esc(d) + '</div>';
    byDay[d].forEach(function(it){
      var k = it.kind || 'listening';
      var pillCls = (k === 'writing' || k === 'translation') ? 'a' : 'g';
      if (it.type === 'rep'){
        var r = it.rep;
        var meta = esc(r.page || '');
        if (r.score) meta += ' · ' + esc(r.score);
        if (r.pct != null) meta += ' · ' + r.pct + '%';
        if (r.excluded) meta += ' · <b style="color:#b45309">存疑·' + esc(r.excl_reason || '') + '，未计入</b>';
        var sm = repSummary(r.text);
        var smCls = (!sm || sm.pct == null) ? '' : (sm.pct >= 60 ? ' ok' : ' bad');
        html += '<details class="it">'
          + '<summary><span class="pill ' + pillCls + '">' + (KIND[k] || '回执') + '</span>'
          + '<span class="tt">' + meta + '</span>'
          + (sm ? '<span class="res' + smCls + '">' + esc(sm.t) + '</span>' : '')
          + '</summary>'
          + '<div class="bd">' + repBody(r.text) + '</div>'
          + coachFor(d, k, coaches)
          + '</details>';
      } else {
        /* 有文本回执时，批改已挂在回执下，照片条不再重复挂 */
        var dup = hasRep[(d || '') + '|' + k];
        html += '<div class="it">'
          + '<div class="hd"><span class="pill a">' + (KIND[k] || '手写') + '照</span>'
          + '<span class="tt">' + esc(it.page || '') + ' · ' + it.n + ' 张</span></div>'
          + '<div class="bd">手写照片已上云。</div>'
          + (dup ? '' : coachFor(d, k, coaches))
          + '</div>';
      }
    });
  });
  document.getElementById('cnt').textContent = items.length + ' 条';
  document.getElementById('list').innerHTML = html;
}

/* 展开后的正文：含「第N题：」的回执按行渲染，错题标红，正确题压灰。
   不含逐题的（写作/翻译的长段落）保持原来的 pre-wrap 整段。 */
function repBody(t){
  var raw = String(t || '');
  if (!/第\s*\d+\s*题\s*[:：]/.test(raw)) return esc(raw);
  return raw.split('\n').filter(function(line){
    /* 尾行「—— 请据此给我出错因归因和改善方法」是发给批改用的指令，对本人无意义 */
    return !/请据此|请据此给/.test(line) && !/^\s*——\s*$/.test(line);
  }).map(function(line){
    var l = esc(line);
    if (/^\s*第\s*\d+\s*题\s*[:：]\s*[✘✗✕]/.test(line)) return '<span class="ln bad">' + l + '</span>';
    if (/^\s*第\s*\d+\s*题\s*[:：]\s*[✔✓]/.test(line)) return '<span class="ln ok">' + l + '</span>';
    return '<span class="ln">' + l + '</span>';
  }).join('');
}
/* 从回执正文里抽出「结果：1/7 · 正确率 14%」当摘要，抽不到就返回空 */
function repSummary(t){
  var m = /结果[:：]\s*([^\n]{1,40})/.exec(t || '');
  if (!m) return '';
  var txt = m[1].trim().replace(/正确率\s*/, '');   /* 「1/7 · 14%」比「1/7 · 正确率 14%」省 4 个字，标题才不被挤没 */
  var p = /(\d+)\s*%/.exec(txt);
  return { t: txt, pct: p ? Number(p[1]) : null };
}

function coachFor(date, kind, coaches){
  var hit = coaches.filter(function(c){
    return c.date === date && (!c.kind || c.kind === kind);
  });
  if (!hit.length) return '';
  return hit.map(function(c){
    return '<div class="coach"><b>教练归因</b><br>' + esc(c.text || '') + '</div>';
  }).join('');
}

/* 错题本：本地 + 云端合并渲染 */
function renderWrongbook(cloudWb){
  function wbEsc(x){ return String(x==null?'':x).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  try{
    var arr = JSON.parse(localStorage.getItem('cet4_wrongbook') || '[]') || [];
    (cloudWb || []).forEach(function(c){
      var idx = -1;
      arr.forEach(function(a, k){ if (a.type === c.type && a.page === c.page) idx = k; });
      if (idx >= 0) arr[idx] = c; else arr.push(c);
    });
    var cnt = document.getElementById('wcnt'), box = document.getElementById('wrongList');
    if (!cnt || !box) return;
    if (!arr.length){ cnt.textContent = '0 题'; return; }
    arr.sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
    var html = '', total = 0, i, j;
    for (i = 0; i < arr.length; i++){
      var w = arr[i];
      total += (w.items||[]).length + (w.lines||[]).length;
      /* 题目类错题给一个回原页的入口：原来只能看，不能回去重听那一段 */
      var back = (w.page && w.type !== 'listen-dict')
        ? ' <a href="' + wbEsc(w.page) + '" style="font-size:12px;color:var(--blue);'
          + 'text-decoration:none;font-weight:600;white-space:nowrap">重做这段 ›</a>' : '';
      html += '<div class="day">' + wbEsc(w.date) + ' · ' + wbEsc(w.title || w.page || '') + back + '</div>';
      if (w.type === 'listen-dict'){
        html += '<div class="it"><div class="hd"><span class="pill a">听写没听清</span></div>';
        for (j = 0; j < (w.lines||[]).length; j++){
          var l = w.lines[j];
          html += '<div class="bd" style="margin:4px 0">第' + (l.li + 1) + '句 · ' + wbEsc(l.en)
            + ' <a href="review.html?one=' + encodeURIComponent((w.page||'') + '#' + l.li)
            + '" style="white-space:nowrap;color:var(--blue);text-decoration:none;font-weight:600">回炉 ›</a></div>';
        }
        html += '</div>';
      } else {
        var isRead = w.type === 'read-quiz';
        for (j = 0; j < (w.items||[]).length; j++){
          var it = w.items[j];
          html += '<div class="it"><div class="hd">'
            + '<span class="pill ' + (isRead ? '' : 'g') + '">' + (isRead ? '阅读错题' : '听力错题') + '</span>'
            + '<span class="tt">' + wbEsc(it.stem || '') + '</span></div>'
            + '<div class="bd">你选 <b style="color:var(--red)">' + wbEsc(it.user || '') + '</b>，正确答案 <b style="color:var(--green)">' + wbEsc(it.right || '') + '</b></div>'
            + (it.ansLine ? '<div class="bd" style="color:var(--sub);font-size:13px">答案句：' + wbEsc(it.ansLine) + '</div>' : '')
            + '</div>';
        }
      }
    }
    cnt.textContent = total + ' 题';
    box.innerHTML = html;
  }catch(e){}
}

/* ── 错因分布：聚合 cet4_why_v1（听力/阅读交卷后勾的「为什么错」）── */
(function(){
  var LAYER = { '连读':'speech', '弱读':'speech', '失爆':'speech',
                '生词':'word', '熟词僻义':'word',
                '语法':'logic', '技巧':'logic', '走神':'state' };
  var COLOR = { speech:'var(--red)', word:'var(--amber)', logic:'var(--blue)', state:'var(--sub)' };

  function readItems(){
    var db = null;
    try{ db = JSON.parse(localStorage.getItem('cet4_why_v1') || ''); }catch(e){ db = null; }
    return (db && db.items && db.items.length) ? db.items : [];
  }

  function render(){
    var card = document.getElementById('whyCard');
    if (!card) return;
    var items = readItems();
    if (!items.length) return;

    var cnt = {}, total = 0;
    items.forEach(function(it){
      (it.why || []).forEach(function(w){ cnt[w] = (cnt[w] || 0) + 1; total++; });
    });
    if (!total) return;

    var keys = Object.keys(cnt).sort(function(a,b){ return cnt[b] - cnt[a]; });
    var max = cnt[keys[0]] || 1;

    document.getElementById('whyBars').innerHTML = keys.map(function(w){
      var pct = Math.round(cnt[w] / max * 100);
      var c = COLOR[LAYER[w]] || 'var(--sub)';
      return '<div class="wbar"><span class="nm">' + w + '</span>'
           + '<span class="tr"><i style="width:' + pct + '%;background:' + c + '"></i></span>'
           + '<span class="n">' + cnt[w] + '</span></div>';
    }).join('');

    document.getElementById('whyMeta').textContent = items.length + ' 道错题 · ' + total + ' 次标注';

    var layer = { speech:0, word:0, logic:0, state:0 };
    keys.forEach(function(w){ layer[LAYER[w] || 'state'] += cnt[w]; });
    var top = Object.keys(layer).sort(function(a,b){ return layer[b] - layer[a]; })[0];
    var pctTop = Math.round(layer[top] / total * 100);
    var MSG = {
      speech: '你的错 <b>' + pctTop + '%</b> 落在语音层——连读、弱读、失爆把词黏成一团。这不是词汇量问题：练逐句跟读和词级辨音，比背单词见效快。',
      word:   '你的错 <b>' + pctTop + '%</b> 是词不认识，或认识的是另一个意思。先把生词过一遍，再回来重听同一段，效果翻倍。',
      logic:  '你的错 <b>' + pctTop + '%</b> 在解题层——听懂了却没抓住考点。开听前先用选项反推问题，带着目标去听。',
      state:  '你的错 <b>' + pctTop + '%</b> 是走神。说明单次训练偏长或选段太难，把一轮压到 10 分钟以内。'
    };
    var ins = document.getElementById('whyInsight');
    if (MSG[top]){ ins.innerHTML = MSG[top]; ins.style.display = 'block'; }
    card.style.display = 'block';
  }

  render();
  window.__renderWhy = render;
})();

/* ── 听词卡壳：cet4_word_v1 按页分组 ── */
(function(){
  var card = document.getElementById('wordCard');
  if (!card) return;
  var items = [];
  try{
    var db = JSON.parse(localStorage.getItem('cet4_word_v1') || '');
    items = (db && db.items) ? db.items : [];
  }catch(e){ items = []; }
  if (!items.length) return;

  var byPage = {};
  items.forEach(function(x){ (byPage[x.page] = byPage[x.page] || []).push(x.w); });
  var pages = Object.keys(byPage).sort(function(a,b){ return byPage[b].length - byPage[a].length; });

  document.getElementById('wordList').innerHTML = pages.map(function(pg){
    var ws = byPage[pg];
    return '<div style="margin-bottom:11px">'
      + '<div style="font-size:12.5px;color:var(--sub);margin-bottom:6px">'
      + '<a href="' + pg + '?wd=1" style="color:var(--blue);text-decoration:none;font-weight:700">'
      + pg.replace('.html','') + '</a> · ' + ws.length + ' 词</div>'
      + '<div>' + ws.slice(0, 14).map(function(w){ return '<span class="wchip">' + w + '</span>'; }).join('')
      + (ws.length > 14 ? '<span class="wchip more">+' + (ws.length - 14) + '</span>' : '')
      + '</div></div>';
  }).join('');

  document.getElementById('wordMeta').textContent = items.length + ' 个词 · 点页名重练';
  card.style.display = 'block';
})();


/* ── 整套听力记录（cet4_set_*）── */
(function(){
  var rows = [];
  try{
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (!/^cet4_set_/.test(k)) continue;
      var o = JSON.parse(localStorage.getItem(k) || 'null');
      /* a 必须存在：老版本、或存储被浏览器裁剪时可能只有 score 没有分段，
         那样下面 r.a[0] 会抛错，整张卡连带后面几块一起不渲染 */
      if (!o || !o.d || !o.a || o.a.length !== 3) continue;
      rows.push({ id: k.replace(/^cet4_set_/, ''), d: o.d, s: o.score, a: o.a, ts: o.ts || 0 });
    }
  }catch(e){}
  if (!rows.length) return;
  rows.sort(function(x, y){ return (y.ts || 0) - (x.ts || 0); });
  var el = document.getElementById('setList'), meta = document.getElementById('setMeta');
  el.innerHTML = rows.map(function(r, i){
    var nm = r.id.replace(/^(\d{4})-(\d{2})-(\d{2})$/, function(m, y, mo, d){
      return y + ' 年 ' + (+mo) + ' 月第 ' + (+d) + ' 套';
    });
    var cls = r.s >= 20 ? 'var(--green)' : (r.s >= 15 ? 'var(--amber)' : 'var(--red)');
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)">'
      + '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">' + nm + '</div>'
      + '<div style="font-size:12px;color:var(--sub);margin-top:2px">' + r.d
      + '　A ' + r.a[0] + '/7 · B ' + r.a[1] + '/8 · C ' + r.a[2] + '/10</div></div>'
      + '<div style="font-size:15px;font-weight:800;color:' + cls + '">' + r.s + '<span style="font-size:11.5px;color:var(--sub)">/25</span></div>'
      + '</div>';
  }).join('');
  meta.textContent = rows.length + ' 套 · 最近一次 ' + rows[0].d;
  document.getElementById('setCard').style.display = 'block';
})();

</script>
<script>
/* 进度导出 / 导入：只碰 cet4_ 前缀的键，ntfy、别的站点数据不动。
   导入前二次确认，因为会覆盖同名的本地记录。 */
(function(){
  var meta = document.getElementById('bkMeta');
  var expBtn = document.getElementById('expBtn');
  var impBtn = document.getElementById('impBtn');
  var impFile = document.getElementById('impFile');
  if (!meta || !expBtn || !impBtn || !impFile) return;

  function collect(){
    var d = {};
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k.indexOf('cet4_') === 0) d[k] = localStorage.getItem(k);
    }
    return d;
  }

  function stamp(){
    var t = new Date();
    return t.getFullYear() + ('0' + (t.getMonth() + 1)).slice(-2) + ('0' + t.getDate()).slice(-2);
  }

  var data = collect();
  var keys = Object.keys(data);
  if (!keys.length){
    meta.textContent = '本机还没有记录';
    expBtn.disabled = true;
    expBtn.style.opacity = '.45';
    expBtn.style.cursor = 'default';
  } else {
    var size = new Blob([JSON.stringify({ v: 1, d: data })]).size;
    meta.textContent = keys.length + ' 项 · ' + (size / 1024).toFixed(1) + ' KB';
  }

  expBtn.addEventListener('click', function(){
    var payload = { v: 1, ts: Date.now(), app: 'cet4-trainer', d: collect() };
    var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cet4-progress-' + stamp() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    meta.textContent = '已导出 ' + Object.keys(payload.d).length + ' 项';
  });

  impBtn.addEventListener('click', function(){ impFile.click(); });

  impFile.addEventListener('change', function(){
    var f = this.files && this.files[0];
    if (!f) return;
    var box = document.getElementById('bkBody');
    Array.prototype.forEach.call(box.querySelectorAll('.impmsg'), function(e){ e.remove(); });
    var r = new FileReader();
    r.onload = function(){
      var o = null;
      try{ o = JSON.parse(r.result); }catch(e){ o = null; }
      if (!o || !o.d || typeof o.d !== 'object'){
        box.insertAdjacentHTML('beforeend',
          '<p class="impmsg" style="font-size:12.5px;color:var(--red);margin:10px 0 0">这个文件读不出来。要选导出的 .json 原文件，不要改名或转存成 txt。</p>');
        return;
      }
      var ks = Object.keys(o.d).filter(function(k){ return k.indexOf('cet4_') === 0; });
      if (!ks.length){
        box.insertAdjacentHTML('beforeend',
          '<p class="impmsg" style="font-size:12.5px;color:var(--red);margin:10px 0 0">文件里没有可导入的记录。</p>');
        return;
      }
      var mine = Object.keys(collect()).length;
      var ok = confirm('这个文件里有 ' + ks.length + ' 项记录。\n本机现在有 ' + mine + ' 项，同名的会被覆盖。\n'
        + (o.ts ? '导出时间：' + new Date(o.ts).toLocaleString() + '\n' : '')
        + '继续导入？');
      if (!ok) return;
      try{
        ks.forEach(function(k){ localStorage.setItem(k, o.d[k]); });
      }catch(e){
        box.insertAdjacentHTML('beforeend',
          '<p class="impmsg" style="font-size:12.5px;color:var(--red);margin:10px 0 0">写入失败：浏览器存储空间不够，先清一些别的站点数据再试。</p>');
        return;
      }
      box.insertAdjacentHTML('beforeend',
        '<p class="impmsg" style="font-size:12.5px;color:var(--green);margin:10px 0 0">已导入 '
        + ks.length + ' 项，正在刷新…</p>');
      setTimeout(function(){ location.reload(); }, 900);
    };
    r.onerror = function(){
      box.insertAdjacentHTML('beforeend',
        '<p class="impmsg" style="font-size:12.5px;color:var(--red);margin:10px 0 0">读取文件失败，可能是文件损坏。</p>');
    };
    r.readAsText(f);
  });
})();
</script>
</body>
