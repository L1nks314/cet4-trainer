<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的记录 · 四级冲刺</title>
<style>
:root{ --bg:#f4f5f7; --card:#ffffff; --soft:#fafbfc;
 --line:#e5e8ec; --line2:#eff1f4;
 --txt:#1b1e23; --txt2:#2b303a; --sub:#6b7280; --sub2:#a8b0bb;
 --blue:#2563eb; --blue-soft:#eef3ff; --green:#0d8a52; --green-soft:#e8f7ef;
 --red:#c0392b; --red-soft:#fdecea; --amber:#b45309; --amber-soft:#fef6e7;
 --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05); }
@media (prefers-color-scheme: dark){
 :root{ --bg:#101216; --card:#181b20; --soft:#20242a;
  --line:#272c33; --line2:#22262c;
  --txt:#e9ebee; --txt2:#d5d9de; --sub:#98a0aa; --sub2:#6b7280;
  --blue:#6b96fb; --blue-soft:#1b2536; --green:#4ec98a; --green-soft:#152a20;
  --red:#f0776a; --red-soft:#2c1a18; --amber:#e3a54a; --amber-soft:#2b2317;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 60px;background:var(--bg);color:var(--txt);
 font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
 max-width:820px;margin-left:auto;margin-right:auto}
.back{display:inline-block;margin-bottom:12px;color:var(--blue);text-decoration:none;font-size:14px;font-weight:600}
h1{font-size:22px;margin:0 0 16px;letter-spacing:-.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.chead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.chead h2{font-size:16px;margin:0}
.cmeta{font-size:12.5px;color:var(--sub)}
.day{font-size:12.5px;font-weight:800;color:var(--sub);margin:16px 0 8px;letter-spacing:.5px}
.day:first-child{margin-top:0}
.it{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--soft)}
.it .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--blue-soft);color:var(--blue)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.it .tt{font-size:13.5px;font-weight:700;color:var(--txt2)}
.it .bd{font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--txt2)}
.coach{border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;
 padding:11px 13px;margin-top:9px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;
 color:var(--txt2);word-break:break-word}
.coach b{color:var(--green)}
.empty{color:var(--sub);font-size:13.5px;text-align:center;padding:26px 0}
.tip{background:var(--blue-soft);color:var(--blue);border-radius:11px;padding:11px 14px;
 font-size:13px;line-height:1.75;margin-bottom:14px}
.wbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.wbar .nm{flex:0 0 76px;color:var(--txt2);font-weight:600}
.wbar .tr{flex:1;height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.wbar .tr i{display:block;height:100%;border-radius:5px}
.wchip{display:inline-block;background:var(--red-soft);color:var(--red);border-radius:7px;
 padding:3px 9px;font-size:12.5px;font-weight:600;margin:0 5px 5px 0}
.wchip.more{background:var(--line2);color:var(--sub)}
.wbar .n{flex:0 0 30px;text-align:right;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回作战台</a>
<h1>我的记录</h1>

<div class="tip">
  <b>这里能看到你交过的每一份回执。</b><br>
  听力 / 阅读判分后自动上云；写作、翻译点「把文字发给我批改」后上云。<br>
  教练的归因与批改会追加在对应回执下面（晚间复盘后更新）。
</div>


<div class="card" id="wordCard" style="display:none">
  <div class="chead"><h2>听词卡壳</h2><span class="cmeta" id="wordMeta"></span></div>
  <div id="wordList"></div>
</div>

<div class="card" id="whyCard" style="display:none">
  <div class="chead"><h2>错因分布</h2><span class="cmeta" id="whyMeta"></span></div>
  <div id="whyBars"></div>
  <div class="tip" id="whyInsight" style="margin:12px 0 0;display:none"></div>
</div>

<div class="card">
  <div class="chead"><h2>错题本</h2><span class="cmeta" id="wcnt">0 题</span></div>
  <div id="wrongList"><div class="empty">判分后错题会自动收进这里；听写没听清的句子也会进来。</div></div>
</div>

<div class="card">
  <div class="chead"><h2>回执与批改</h2><span class="cmeta" id="cnt">加载中…</span></div>
  <div id="list"><div class="empty">正在拉取云端记录…</div></div>
</div>

<script>
var TOPIC = 'cet4-718beb5773e8edd9ef48eb651cb1439dd362eb4a8d28f449';
var KIND = {listening:'听力', reading:'阅读', writing:'写作', translation:'翻译'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* 历史档案（records.json，永久）+ ntfy 实时，合并去重 */
Promise.all([
  fetch('records.json?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1&since=all')
    .then(function(r){ return r.text(); }).catch(function(){ return ''; })
]).then(function(res){
  var arch = res[0] || {};
  /* 无效回执：刷新后选项丢失、点了提交 → 「我选 undefined / 0 分」，一律丢弃 */
  function badRep(p){ return /undefined/i.test(String(p.text || '')); }
  var recs = (arch.reps || []).filter(function(r){ return !badRep(r); });
  var coaches = (arch.coaches || []).slice();
  var photos = (arch.photos || []).slice();
  var wbs = [];

  function repScore(p){
    var s = p.score;
    if (!s){
      var m = String(p.text || '').match(/结果：(\d+\/\d+)/);
      s = m ? m[1] : '';
    }
    return s;
  }
  var repKeys = {}, coachKeys = {}, photoKeys = {};
  recs.forEach(function(r){ repKeys[(r.date||'')+'|'+(r.kind||'')+'|'+(r.page||'')+'|'+(r.score||'')] = 1; });
  coaches.forEach(function(c){ coachKeys[(c.date||'')+'|'+(c.kind||'')+'|'+(c.text||'')] = 1; });
  photos.forEach(function(p){ photoKeys[p.name||''] = 1; });

  String(res[1] || '').trim().split('\n').forEach(function(line){
    if (!line.trim()) return;
    var m; try{ m = JSON.parse(line); }catch(e){ return; }
    var p; try{ p = JSON.parse(m.message); }catch(e){ return; }
    if (!p || !p.t) return;
    if (p.t === 'rep'){
      if (badRep(p)) return;
      var k = (p.date||'')+'|'+(p.kind||'')+'|'+(p.page||'')+'|'+repScore(p);
      if (!repKeys[k]) { recs.push(p); repKeys[k] = 1; }
    } else if (p.t === 'coach'){
      var k2 = (p.date||'')+'|'+(p.kind||'')+'|'+(p.text||'');
      if (!coachKeys[k2]) { coaches.push(p); coachKeys[k2] = 1; }
    } else if (p.t === 'photo'){
      var att = m.attachment || {};
      var name = att.name || '';
      if (name && !photoKeys[name]) { photos.push(p); photoKeys[name] = 1; }
    } else if (p.t === 'wrongbook'){
      wbs.push(p);
    }
  });

  render(recs, coaches, photos);
  renderWrongbook(wbs);
}).catch(function(){
  document.getElementById('list').innerHTML = '<div class="empty">拉取失败 —— 检查网络后刷新本页。</div>';
});

function render(recs, coaches, photos){
  var items = [];
  /* 同一 date+kind+page 的重复回执只保留最后一条（防多次点击重复上云） */
  var rmap = {}, hasRep = {};
  recs.forEach(function(r){
    var key = (r.date || '') + '|' + (r.kind || 'listening') + '|' + (r.page || '');
    rmap[key] = r;
  });
  Object.keys(rmap).forEach(function(key){
    var r = rmap[key];
    hasRep[(r.date || '') + '|' + (r.kind || 'listening')] = true;
    items.push({ type:'rep', date:r.date, kind:(r.kind || 'listening'), page:r.page, rep:r });
  });
  /* 手写照片也单独成条（写作/翻译常常只传照片、没有文本回执） */
  var pmap = {};
  (photos || []).forEach(function(p){
    var key = (p.date || '') + '|' + (p.kind || '') + '|' + (p.page || '');
    if (!pmap[key]) pmap[key] = { type:'photo', date:p.date, kind:(p.kind || 'listening'), page:p.page, n:0 };
    pmap[key].n++;
  });
  Object.keys(pmap).forEach(function(k){ items.push(pmap[k]); });

  if (!items.length){
    document.getElementById('cnt').textContent = '0 条';
    document.getElementById('list').innerHTML =
      '<div class="empty">还没有回执或照片。做完一套听力/阅读，或上传手写照后会自动出现在这里。</div>';
    return;
  }
  items.sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
  var byDay = {};
  items.forEach(function(it){ (byDay[it.date] = byDay[it.date] || []).push(it); });
  var days = Object.keys(byDay).sort().reverse();
  var html = '';
  days.forEach(function(d){
    html += '<div class="day">' + esc(d) + '</div>';
    byDay[d].forEach(function(it){
      var k = it.kind || 'listening';
      var pillCls = (k === 'writing' || k === 'translation') ? 'a' : 'g';
      if (it.type === 'rep'){
        var r = it.rep;
        var meta = esc(r.page || '');
        if (r.score) meta += ' · ' + esc(r.score);
        if (r.pct != null) meta += ' · ' + r.pct + '%';
        html += '<div class="it">'
          + '<div class="hd"><span class="pill ' + pillCls + '">' + (KIND[k] || '回执') + '</span>'
          + '<span class="tt">' + meta + '</span></div>'
          + '<div class="bd">' + esc(r.text || '') + '</div>'
          + coachFor(d, k, coaches)
          + '</div>';
      } else {
        /* 有文本回执时，批改已挂在回执下，照片条不再重复挂 */
        var dup = hasRep[(d || '') + '|' + k];
        html += '<div class="it">'
          + '<div class="hd"><span class="pill a">' + (KIND[k] || '手写') + '照</span>'
          + '<span class="tt">' + esc(it.page || '') + ' · ' + it.n + ' 张</span></div>'
          + '<div class="bd">手写照片已上云。</div>'
          + (dup ? '' : coachFor(d, k, coaches))
          + '</div>';
      }
    });
  });
  document.getElementById('cnt').textContent = items.length + ' 条';
  document.getElementById('list').innerHTML = html;
}

function coachFor(date, kind, coaches){
  var hit = coaches.filter(function(c){
    return c.date === date && (!c.kind || c.kind === kind);
  });
  if (!hit.length) return '';
  return hit.map(function(c){
    return '<div class="coach"><b>教练归因</b><br>' + esc(c.text || '') + '</div>';
  }).join('');
}

/* 错题本：本地 + 云端合并渲染 */
function renderWrongbook(cloudWb){
  function wbEsc(x){ return String(x==null?'':x).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  try{
    var arr = JSON.parse(localStorage.getItem('cet4_wrongbook') || '[]') || [];
    (cloudWb || []).forEach(function(c){
      var idx = -1;
      arr.forEach(function(a, k){ if (a.type === c.type && a.page === c.page) idx = k; });
      if (idx >= 0) arr[idx] = c; else arr.push(c);
    });
    var cnt = document.getElementById('wcnt'), box = document.getElementById('wrongList');
    if (!cnt || !box) return;
    if (!arr.length){ cnt.textContent = '0 题'; return; }
    arr.sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; });
    var html = '', total = 0, i, j;
    for (i = 0; i < arr.length; i++){
      var w = arr[i];
      total += (w.items||[]).length + (w.lines||[]).length;
      html += '<div class="day">' + wbEsc(w.date) + ' · ' + wbEsc(w.title || w.page || '') + '</div>';
      if (w.type === 'listen-dict'){
        html += '<div class="it"><div class="hd"><span class="pill a">听写没听清</span></div>';
        for (j = 0; j < (w.lines||[]).length; j++){
          var l = w.lines[j];
          html += '<div class="bd" style="margin:4px 0">第' + (l.li + 1) + '句 · ' + wbEsc(l.en)
            + ' <a href="review.html?one=' + encodeURIComponent((w.page||'') + '#' + l.li)
            + '" style="white-space:nowrap;color:var(--blue);text-decoration:none;font-weight:600">回炉 ›</a></div>';
        }
        html += '</div>';
      } else {
        var isRead = w.type === 'read-quiz';
        for (j = 0; j < (w.items||[]).length; j++){
          var it = w.items[j];
          html += '<div class="it"><div class="hd">'
            + '<span class="pill ' + (isRead ? '' : 'g') + '">' + (isRead ? '阅读错题' : '听力错题') + '</span>'
            + '<span class="tt">' + wbEsc(it.stem || '') + '</span></div>'
            + '<div class="bd">你选 <b style="color:var(--red)">' + wbEsc(it.user || '') + '</b>，正确答案 <b style="color:var(--green)">' + wbEsc(it.right || '') + '</b></div>'
            + (it.ansLine ? '<div class="bd" style="color:var(--sub);font-size:13px">答案句：' + wbEsc(it.ansLine) + '</div>' : '')
            + '</div>';
        }
      }
    }
    cnt.textContent = total + ' 题';
    box.innerHTML = html;
  }catch(e){}
}

/* ── 错因分布：聚合 cet4_why_v1（听力/阅读交卷后勾的「为什么错」）── */
(function(){
  var LAYER = { '连读':'speech', '弱读':'speech', '失爆':'speech',
                '生词':'word', '熟词僻义':'word',
                '语法':'logic', '技巧':'logic', '走神':'state' };
  var COLOR = { speech:'var(--red)', word:'var(--amber)', logic:'var(--blue)', state:'var(--sub)' };

  function readItems(){
    var db = null;
    try{ db = JSON.parse(localStorage.getItem('cet4_why_v1') || ''); }catch(e){ db = null; }
    return (db && db.items && db.items.length) ? db.items : [];
  }

  function render(){
    var card = document.getElementById('whyCard');
    if (!card) return;
    var items = readItems();
    if (!items.length) return;

    var cnt = {}, total = 0;
    items.forEach(function(it){
      (it.why || []).forEach(function(w){ cnt[w] = (cnt[w] || 0) + 1; total++; });
    });
    if (!total) return;

    var keys = Object.keys(cnt).sort(function(a,b){ return cnt[b] - cnt[a]; });
    var max = cnt[keys[0]] || 1;

    document.getElementById('whyBars').innerHTML = keys.map(function(w){
      var pct = Math.round(cnt[w] / max * 100);
      var c = COLOR[LAYER[w]] || 'var(--sub)';
      return '<div class="wbar"><span class="nm">' + w + '</span>'
           + '<span class="tr"><i style="width:' + pct + '%;background:' + c + '"></i></span>'
           + '<span class="n">' + cnt[w] + '</span></div>';
    }).join('');

    document.getElementById('whyMeta').textContent = items.length + ' 道错题 · ' + total + ' 次标注';

    var layer = { speech:0, word:0, logic:0, state:0 };
    keys.forEach(function(w){ layer[LAYER[w] || 'state'] += cnt[w]; });
    var top = Object.keys(layer).sort(function(a,b){ return layer[b] - layer[a]; })[0];
    var pctTop = Math.round(layer[top] / total * 100);
    var MSG = {
      speech: '你的错 <b>' + pctTop + '%</b> 落在语音层——连读、弱读、失爆把词黏成一团。这不是词汇量问题：练逐句跟读和词级辨音，比背单词见效快。',
      word:   '你的错 <b>' + pctTop + '%</b> 是词不认识，或认识的是另一个意思。先把生词过一遍，再回来重听同一段，效果翻倍。',
      logic:  '你的错 <b>' + pctTop + '%</b> 在解题层——听懂了却没抓住考点。开听前先用选项反推问题，带着目标去听。',
      state:  '你的错 <b>' + pctTop + '%</b> 是走神。说明单次训练偏长或选段太难，把一轮压到 10 分钟以内。'
    };
    var ins = document.getElementById('whyInsight');
    if (MSG[top]){ ins.innerHTML = MSG[top]; ins.style.display = 'block'; }
    card.style.display = 'block';
  }

  render();
  window.__renderWhy = render;
})();

/* ── 听词卡壳：cet4_word_v1 按页分组 ── */
(function(){
  var card = document.getElementById('wordCard');
  if (!card) return;
  var items = [];
  try{
    var db = JSON.parse(localStorage.getItem('cet4_word_v1') || '');
    items = (db && db.items) ? db.items : [];
  }catch(e){ items = []; }
  if (!items.length) return;

  var byPage = {};
  items.forEach(function(x){ (byPage[x.page] = byPage[x.page] || []).push(x.w); });
  var pages = Object.keys(byPage).sort(function(a,b){ return byPage[b].length - byPage[a].length; });

  document.getElementById('wordList').innerHTML = pages.map(function(pg){
    var ws = byPage[pg];
    return '<div style="margin-bottom:11px">'
      + '<div style="font-size:12.5px;color:var(--sub);margin-bottom:6px">'
      + '<a href="' + pg + '?wd=1" style="color:var(--blue);text-decoration:none;font-weight:700">'
      + pg.replace('.html','') + '</a> · ' + ws.length + ' 词</div>'
      + '<div>' + ws.slice(0, 14).map(function(w){ return '<span class="wchip">' + w + '</span>'; }).join('')
      + (ws.length > 14 ? '<span class="wchip more">+' + (ws.length - 14) + '</span>' : '')
      + '</div></div>';
  }).join('');

  document.getElementById('wordMeta').textContent = items.length + ' 个词 · 点页名重练';
  card.style.display = 'block';
})();

</script>
</body>
</html>
