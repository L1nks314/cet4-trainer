name: 照片转存 + 记录归档

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 转存照片 + 归档记录
        run: python3 scripts/archive_all.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/ records.json
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "自动归档：照片 / 记录"
            git push
          fi
