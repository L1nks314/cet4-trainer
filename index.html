<style>
:root{ --bg:#f4f5f7; --card:#ffffff; --soft:#fafbfc; --grey:#f2f3f5;
 --line:#e5e8ec; --line2:#eff1f4; --track:#e8ebef;
 --txt:#1b1e23; --txt2:#2b303a; --txt3:#3d434e; --sub:#6b7280; --sub2:#a8b0bb;
 --blue:#2563eb; --blue-soft:#eef3ff; --green:#0d8a52; --green-soft:#e8f7ef;
 --red:#c0392b; --red-soft:#fdecea; --amber:#b45309; --amber-soft:#fef6e7;
 --amber-line:#f0dfb8; --green-line:#bfe3cf;
 --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05);
 --shadow-lg:0 2px 4px rgba(16,24,40,.05), 0 8px 20px rgba(16,24,40,.07); }
@media (prefers-color-scheme: dark){ :root{ --bg:#101216; --card:#191c21; --soft:#20242a; --grey:#22262c;
 --line:#2c313a; --line2:#242930; --track:#2a2f38;
 --txt:#e9ebee; --txt2:#d7dade; --txt3:#c3c8cf; --sub:#98a0aa; --sub2:#6b7280;
 --blue:#6b96fb; --blue-soft:#1a2742; --green:#41d18f; --green-soft:#14301f;
 --red:#ef7261; --red-soft:#371d19; --amber:#e0a53f; --amber-soft:#312713;
 --amber-line:#4a3a1c; --green-line:#1f4530;
 --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.28);
 --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45);
 color-scheme:dark; } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
 font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
 padding:16px 14px 44px;max-width:760px;margin:0 auto;}
h1{font-size:20px;margin:2px 0 16px;letter-spacing:.2px;font-weight:800;
 padding-left:12px;border-left:4px solid var(--blue);line-height:1.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.days{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--blue)}
.days small{font-size:13px;font-weight:500;color:var(--sub);margin-left:4px}
.stage{font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.bar{height:9px;background:var(--track);border-radius:7px;overflow:hidden;margin:14px 0 7px}
.bar i{display:block;height:100%;border-radius:7px;min-width:6px;
 background:linear-gradient(90deg,var(--blue),#5b8dfa)}
.sub{font-size:12.5px;color:var(--sub)}
.task{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.box{flex:0 0 28px;width:28px;height:28px;border:2px solid var(--sub2);border-radius:9px;
 margin-top:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
 font-size:16px;color:#fff;user-select:none;transition:transform .15s,background .15s,border-color .15s}
.box.on{background:var(--green);border-color:var(--green);transform:scale(1.06)}
.box.on::after{content:"✓"}
.tk{flex:1;min-width:0}
.tt{font-size:15.4px;font-weight:700;line-height:1.45}
.td{font-size:13px;color:var(--sub);margin-top:3px}
.task.on .tt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c3c8d0}
.btn{display:inline-block;margin-top:9px;padding:9px 16px;border-radius:9px;background:var(--blue);
 color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.streak{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.streak>div{flex:1;background:var(--soft);border-radius:12px;padding:14px 15px;border:1px solid var(--line)}
.streak>b,.streak>div>b{font-size:28px;font-weight:800;letter-spacing:-.8px;color:var(--blue);
 display:block;line-height:1.15}
.streak .lb{font-size:12.5px;color:var(--sub);margin-top:3px}
.note{font-size:13px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);
 border-radius:10px;padding:11px 13px;margin-top:12px;line-height:1.7}
.lh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;background:var(--card)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);}
a.it{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
 text-decoration:none;color:var(--txt);font-size:14.5px}
a.it:last-child{border-bottom:0}
a.it:active{background:var(--blue-soft)}
a.it .no{color:var(--sub);font-size:12.5px;min-width:24px}
a.it .tx{flex:1}
a.it .ar{color:#c3c8d0}
a.it.done{opacity:.5}
a.it.now{background:var(--green-soft)}
a.it.now .tx{font-weight:700;color:var(--green)}
.tag{font-size:11.5px;padding:2px 7px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:5px}
.hint{color:var(--sub);font-size:12.5px;margin:16px 2px 0;line-height:1.85}

  /* ── 顶部主视觉 ── */
  .hero{background:linear-gradient(135deg,#2563eb 0%,#4f46e5 100%);color:#fff;
    border-radius:16px;padding:17px 18px 15px;margin-bottom:14px;
    box-shadow:0 6px 18px rgba(37,99,235,.22);position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:50%;background:rgba(255,255,255,.09);}
  .hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;}
  .hero .days{font-size:36px;font-weight:800;letter-spacing:-1.5px;color:#fff;line-height:1.05;}
  .hero .days small{font-size:13px;font-weight:500;color:rgba(255,255,255,.82);
    margin-left:6px;letter-spacing:0;display:inline-block;}
  .hero .stage{font-size:12.5px;padding:6px 13px;border-radius:20px;white-space:nowrap;
    background:rgba(255,255,255,.2);color:#fff;font-weight:700;}
  .hero .bar{height:8px;background:rgba(255,255,255,.25);border-radius:5px;
    overflow:hidden;margin:15px 0 8px;position:relative;}
  .hero .bar i{display:block;height:100%;background:#fff;border-radius:5px;min-width:6px;}
  .hero .sub{font-size:12.5px;color:rgba(255,255,255,.88);position:relative;}
  .hero .note{margin-top:13px;padding:11px 13px;border-radius:11px;position:relative;
    background:rgba(255,255,255,.16);font-size:13.2px;color:#fff;line-height:1.65;}
  @media (prefers-color-scheme: dark){
    .hero{background:linear-gradient(135deg,#1e3a8a 0%,#312e81 100%);
      box-shadow:0 8px 24px rgba(0,0,0,.5);}
    .hero .note{background:rgba(255,255,255,.1);}
  }

  /* ── 任务卡左侧状态条 ── */
  .task{position:relative;padding-left:14px;}
  .task::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:3px;
    border-radius:2px;background:var(--blue);opacity:.28;transition:background .2s,opacity .2s;}
  .task.on::before{background:var(--green);opacity:1;}

.tiers{display:flex;gap:6px;margin:10px 0 12px}
.tier{flex:1;padding:7px 4px;border-radius:10px;border:1.5px solid var(--line,#e5e8ec);background:#fff;
 font:600 12.5px/1.35 inherit;color:var(--sub,#6b7280);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tier i{font-style:normal;font-size:11px;opacity:.72;font-weight:500}
.tier.on{background:var(--blue,#2563eb);border-color:var(--blue,#2563eb);color:#fff}
.tier.on i{opacity:.88}

/* ── 折叠区 ── */
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;
 margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.fold>summary{display:flex;align-items:center;gap:8px;padding:14px 16px;
 font-weight:700;font-size:14.5px;cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary span:first-child{flex:1}
.fold>summary::after{content:"›";color:var(--sub2);font-size:18px;line-height:1;
 transform:rotate(90deg);transition:transform .18s}
.fold[open]>summary::after{transform:rotate(-90deg)}
.fold .cnt{font-size:12px;color:var(--sub2);font-weight:500}
.fold>summary{border-bottom:0}
.fold[open]>summary{border-bottom:1px solid var(--line)}

/* ── 今日三步 ── */
.steps .shd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.steps .shd b{font-size:15.5px;font-weight:800;letter-spacing:.1px}
.steps .sdt{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.steps .smin{font-size:12px;color:var(--blue);background:var(--blue-soft);
 padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.step{display:flex;align-items:flex-start;gap:11px;padding:13px 0;
 border-top:1px solid var(--line2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.step .ck{flex:0 0 22px;width:22px;height:22px;border:1.8px solid var(--sub2);border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
 margin-top:1px;transition:background .15s,border-color .15s}
.step.on .ck{background:var(--green);border-color:var(--green)}
.step.on .ck::after{content:"✓"}
.step .sx{flex:1;min-width:0}
.step .st{font-size:14.5px;font-weight:700;line-height:1.4}
.step .sd{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.55}
.step.on .st{color:var(--sub2);text-decoration:line-through;text-decoration-color:#c3c8d0}
.step .sm{font-size:11.5px;color:var(--sub2);font-variant-numeric:tabular-nums;
 margin-top:2px;flex:0 0 auto}
.stepacts{display:flex;gap:8px;margin-top:14px}
.stepacts .btn{margin-top:0;flex:1;text-align:center;padding:12px 10px}

/* 训练列表 */
#list a.it .st-done{color:var(--green);font-size:12px;font-weight:700}
</style>

var PROG_KEY = "cet4_prog_v1";
var BASE = {"2026-10-17": {l:1, o:1, r:1}};

function d0(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate());}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function loadLocal(){
  try{ var o=JSON.parse(localStorage.getItem(PROG_KEY)||"{}"); return (o&&typeof o==="object")?o:{}; }
  catch(e){ return {}; }
}
function saveLocal(p){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){} }

function loadDone(){                 // 训练页写的 cet4_done → PROG 结构（含历史）
  try{
    var d=JSON.parse(localStorage.getItem('cet4_done')||'{}'), out={}, k;
    for(k in d){
      var v=d[k]||{};
      if(v.listen||v.other||v.receipt) out[k]={ l:v.listen?1:0, o:v.other?1:0, r:v.receipt?1:0 };
    }
    return out;
  }catch(e){ return {}; }
}

function mergeProg(){                 // 并集：任一层标记完成即算完成
  var out={}, keys={}, i;
  for(i=0;i<arguments.length;i++){
    var o=arguments[i]; if(!o) continue;
    for(var k in o) keys[k]=1;
  }
  for(var k in keys){
    var m={};
    for(var j=0;j<arguments.length;j++){
      var v=(arguments[j]||{})[k]||{};
      m.l = m.l || v.l; m.o = m.o || v.o; m.r = m.r || v.r;
    }
    if(m.l||m.o||m.r) out[k]=m;
  }
  return out;
}

var synced = null;                    // null=未知 true=已同步 false=离线
function setSync(ok){
  synced = ok;
  var el=document.getElementById("syncTag"); if(!el) return;
  var t=new Date();
  var hh=String(t.getHours()).padStart(2,"0"), mm=String(t.getMinutes()).padStart(2,"0");
  if(ok===true){ el.textContent="☁ "+hh+":"+mm; el.style.color=""; }
  else if(ok===false){ el.textContent="⌂ 本机"; el.style.color="rgba(255,255,255,.72)"; }
  else { el.textContent="☁ 同步中…"; }
}

function pull(){
  if(!window.fetch) return Promise.resolve(null);
  return fetch(SYNC_URL+"/json?poll=1&since=all", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(t){
      t=(t||"").trim(); if(!t) return null;
      var out={}, found=false;
      t.split("\n").filter(Boolean).forEach(function(line){
        try{
          var d=JSON.parse(line);
          if(d.event && d.event!=="message") return;
          var p=JSON.parse(d.message||"{}");
          if(!p || typeof p!=="object" || p.t) return;       /* 跳过 rep/coach/photo */
          var hasDate=false, k;
          for(k in p){
            if(k.length===10 && k.split("-").length===3){ hasDate=true; break; }
          }
          if(!hasDate) return;                              /* 只认打卡快照 */
          found=true;
          for(k in p){
            if(!out[k]) out[k]={};
            out[k].l = out[k].l || p[k].l;
            out[k].o = out[k].o || p[k].o;
            out[k].r = out[k].r || p[k].r;
          }
        }catch(e){}
      });
      return found ? out : null;
    })
    .catch(function(){ return undefined; });   // undefined = 网络失败
}

function push(p){
  if(!window.fetch) return;
  fetch(SYNC_URL, {method:"POST", body:JSON.stringify(p)})
    .then(function(r){ setSync(r.ok); })
    .catch(function(){ setSync(false); });
}

/* ── 计算 ── */
var today=d0(new Date());
var gap=Math.round((today-d0(START))/86400000);
var idx=Math.min(Math.max(gap,0),LESSONS.length-1);
var toExam=Math.round((d0(EXAMD)-today)/86400000);
var dayNo=gap+1;
var totalDays=Math.round((d0(EXAMD)-d0(START))/86400000);
var pct=Math.min(100,Math.round((gap+1)/totalDays*100));

var st=null;
for(var i=0;i<STAGES.length;i++){ if(today>=d0(STAGES[i][0])&&today<=d0(STAGES[i][1])) st=STAGES[i]; }
if(!st) st = today<d0(STAGES[0][0]) ? STAGES[0] : STAGES[2];

var wd=today.getDay();
var inFinal = today >= d0(new Date(2026,10,28));   /* 11/28 起进入整套模考窗口（考前两周） */
var OTHER={0:"本周复盘（30 分钟）",1:"翻译 1 段（20 分钟）",2:"仔细阅读 1 篇（20 分钟）",
           3:"翻译 1 段（20 分钟）",4:"仔细阅读 1 篇（20 分钟）",5:"写作 1 篇（20 分钟）",
           6: inFinal ? "整套模考（Section A→B→C 连做，另抽 40 分钟）"
                      : (gap < 7 ? "写作 1 篇（20 分钟）"
                                  : "本周弱项复盘：重听错题、重做错题（20 分钟）")}[wd];

/* ── 状态 ── */
var PROG = mergeProg(BASE, loadLocal());
var done = PROG[fmt(today)] || {};

/* ── 渲染 ── */
function renderHead(){
  document.getElementById("head").innerHTML=
   '<div class="top"><div class="days">'+toExam+'<small>天后考试</small></div>'
   +'<div class="stage">'+st[2]+'</div></div>'
   +'<div class="bar"><i style="width:'+Math.max(pct,3)+'%"></i></div>'
   +'<div class="sub">集训第 '+dayNo+' 天 / 共 '+totalDays+' 天 · '+(today.getMonth()+1)+'月'+today.getDate()+'日 周'+'日一二三四五六'[wd]
   +' &nbsp;·&nbsp; <span id="syncTag" style="font-size:12px;opacity:.9">☁ 同步中…</span></div>'
   +'<div class="note">本阶段重点：'+st[3]+'</div>';
}

var TIER_KEY = 'cet4_tier_';
function getTier(){
  try{
    var t = localStorage.getItem(TIER_KEY + fmt(today));
    if (t === 'full' || t === 'std' || t === 'min') return t;
  }catch(e){}
  return (wd === 1 || wd === 3 || wd === 5) ? 'full' : 'std';
}
function setTier(t){
  try{ localStorage.setItem(TIER_KEY + fmt(today), t); }catch(e){}
  renderTasks();
}

/* ── 今日三步（三遍法）勾选 ── */
var STEP_KEY = 'cet4_steps_';
function getSteps(){
  try{
    var o = JSON.parse(localStorage.getItem(STEP_KEY + fmt(today)) || '{}');
    return (o && typeof o === 'object') ? o : {};
  }catch(e){ return {}; }
}
function toggleStep(k){
  var st = getSteps();
  st[k] = !st[k];
  try{ localStorage.setItem(STEP_KEY + fmt(today), JSON.stringify(st)); }catch(e){}
  /* 前三步都勾上 → 自动算今天听力完成（第 4 步听写是满配加分项，不强制） */
  var all = !!(st.s1 && st.s2 && st.s3);
  var cur = PROG[fmt(today)] || {};
  if (all && !cur.l){ cur.l = true; PROG[fmt(today)] = cur; saveLocal(PROG); push(PROG); setSync(true); }
  if (!all && cur.l){ cur.l = false; PROG[fmt(today)] = cur; saveLocal(PROG); push(PROG); }
  renderTasks();
  refreshStats();
}

function renderTasks(){
  var man = PROG[fmt(today)] || {};
  var au = {};
  try{ au = (JSON.parse(localStorage.getItem('cet4_done')||'{}')[fmt(today)]) || {}; }catch(e){ au = {}; }
  done = { l: !!(man.l || au.listen), o: !!(man.o || au.other), r: !!(man.r || au.receipt) };

  var lessonTxt, lbtn;
  if (gap<0){ lessonTxt="集训 10/17 开始 · 今天先歇着，明天从这里起步"; lbtn=LESSONS[0].f; }
  else if (gap<LESSONS.length){ lessonTxt=LESSONS[idx].d; lbtn=LESSONS[idx].f; }
  else {
    var r2=LESSONS[gap-LESSONS.length];
    if(r2){ lessonTxt="第2轮精听 · "+r2.d+"（重点听第一遍没听清的句子）"; lbtn=r2.f; }
    else { lessonTxt="两轮已完成 · 保温：重听错句、跟读"; lbtn=LESSONS[0].f; }
  }

  var streak='<div class="streak"><div><b id="sk">0</b><div class="lb">连续打卡（天）</div></div>'
     +'<div><b id="td">0</b><div class="lb">累计完成（天）</div></div></div>';

  /* ── 周日：轻量日 ── */
  if (isRestDay(today)){
    var h1='<div class="task'+(done.o?" on":"")+'" data-k="o"><div class="box'+(done.o?" on":"")+'"></div>'
     +'<div class="tk"><div class="tt">轻量日 · 15 分钟</div>'
     +'<div class="td">本周休息日：只把错题句重听一遍，或跟读 3 句。不做套题、不写回执——歇够明天才有劲。</div>'
     +'<a class="btn" href="records.html">打开错题本 →</a></div></div>' + streak;
    document.getElementById("tasks").innerHTML = h1;
    bindBoxes();
    return;
  }

  var tier = getTier();
  var hasOther = true;   /* 非周日每天都有「其他」项，但只在满配档出现 */
  var tHtml='';

  /* ── 三档选择 ── */
  tHtml += '<div class="tiers">'
    + '<button class="tier'+(tier==='full'?' on':'')+'" data-tier="full">满配<br><i>30 分钟</i></button>'
    + '<button class="tier'+(tier==='std'?' on':'')+'" data-tier="std">标准<br><i>20 分钟</i></button>'
    + '<button class="tier'+(tier==='min'?' on':'')+'" data-tier="min">最小<br><i>10 分钟</i></button>'
    + '</div>';

  /* ── 主任务：三遍法（可勾选的三步） ── */
  if (tier === 'min'){
    tHtml += '<div class="task'+(done.l?" on":"")+'" data-k="l"><div class="box'+(done.l?" on":"")+'"></div>'
     +'<div class="tk"><div class="tt">跟读 3 句 · 10 分钟</div>'
     +'<div class="td">只跟读今天听不清的那 3 句：0.85 跟 2 遍 → 1.0 跟 1 遍。做完这一步就算今天完成。</div>'
     +'<a class="btn" href="shadow.html?p='+encodeURIComponent(lbtn)+'">去跟读 →</a></div></div>';
  } else {
    var ST = getSteps();
    var full = (tier === 'full');
    var steps = [
      {k:'s1', n:'①', t:'只听大意', d:'整段放完，用一句话说出讲什么。听不出也往下走，不回头。', m:'3′'},
      {k:'s2', n:'②', t:'逐句抓主干', d:'每句听完用 3–5 个字说主干：谁·做了什么。每句最多听 2 遍。', m:'8′'},
      {k:'s3', n:'③', t:'影子跟读', d:'不看文本，跟着念。慢半拍、念错都行，嘴不许停。', m:'9′'}
    ];
    if (full) steps.push({k:'s4', n:'④', t:'听写 3 句', d:'挑最难的 3 句写下来，写完对照原文改。', m:'10′'});

    var rows = steps.map(function(s){
      var on = !!ST[s.k];
      return '<div class="step'+(on?' on':'')+'" data-s="'+s.k+'">'
        + '<div class="ck"></div>'
        + '<div class="sx"><div class="st">'+s.n+' '+s.t+'</div><div class="sd">'+s.d+'</div></div>'
        + '<div class="sm">'+s.m+'</div></div>';
    }).join('');

    tHtml += '<div class="steps">'
      + '<div class="shd">'
      +   '<div><b>今天 · 三遍法</b><div class="sdt">'+lessonTxt+'</div></div>'
      +   '<div class="smin">'+(full?'30':'20')+' 分钟</div>'
      + '</div>'
      + rows
      + '<div class="stepacts">'
      +   '<a class="btn" href="'+encodeURI(lbtn)+'">打开训练页</a>'
      +   '<a class="btn ghost" href="shadow.html?p='+encodeURIComponent(lbtn)+'">去跟读</a>'
      + '</div>'
      + '</div>';
  }

  /* ── 写译：仅满配 + 一/三/五 ── */
  if (tier === 'full' && hasOther){
    var obtn=(function(){
      if(wd===6 && inFinal){
        var mock = (today.getDate()===28) ? "2025-12-1_SectionA.html" : "2025-06-2_SectionA.html";
        return '<a class="btn" href="'+encodeURI(mock)+'">整套模考：A→B→C 连做 →</a>';
      }
      var arr=null, lbl='', n=0;
      if(wd===1||wd===3){ arr=TL; lbl='翻译'; n=seq(today,[1,3])-1; }
      else if(wd===2||wd===4){ arr=RL; lbl='阅读'; n=seq(today,[2,4])-1; }
      else if(wd===5){ arr=WL; lbl='写作'; n=seq(today,[5])-1; }
      else if(wd===6 && gap<7){ arr=WL; lbl='写作'; n=seq(today,[6])-1; }
      if(!arr || !arr[n]) return '';
      return '<a class="btn" href="'+encodeURI(arr[n].f)+'">开始今天的'+lbl+' →</a>';
    })();
    if (obtn){
      tHtml += '<div class="task'+(done.o?" on":"")+'" data-k="o"><div class="box'+(done.o?" on":"")+'"></div>'
       +'<div class="tk"><div class="tt">'+OTHER.replace(/（\d+ 分钟）/, '')+' · 15 分钟</div>'
       +'<div class="td">写译/阅读只在满配档出现；状态一般就切「标准」，不用勉强。</div>'+obtn+'</div></div>';
    }
  }

  tHtml += streak;
  document.getElementById("tasks").innerHTML = tHtml;

  document.querySelectorAll('.tier').forEach(function(b){
    b.addEventListener('click', function(){ setTier(b.getAttribute('data-tier')); });
  });
  document.querySelectorAll('.step').forEach(function(el){
    el.addEventListener('click', function(){ toggleStep(el.getAttribute('data-s')); });
  });
  bindBoxes();
}

function bindBoxes(){
  document.querySelectorAll(".task").forEach(function(el){
    el.querySelector(".box").addEventListener("click", function(){
      var k = el.dataset.k, cur = PROG[fmt(today)] || {};
      cur[k] = !cur[k]; PROG[fmt(today)] = cur;
      saveLocal(PROG); push(PROG);
      el.classList.toggle("on", cur[k]); this.classList.toggle("on", cur[k]);
      refreshStats(); setSync(synced===null?null:true);
    });
  });
}

function isRestDay(d){ return d.getDay() === 0; }   /* 每周日 = 轻量日（15 分钟，不算断签） */

function refreshStats(){
  var cnt=0,run=0,d,dd,v;
  for(d=0;d<400;d++){
    dd=new Date(START.getFullYear(),START.getMonth(),START.getDate()+d);
    if(dd>today) break;
    v=PROG[fmt(dd)];
    if(v && (v.l||v.o)) cnt++;
  }
  for(d=0;d<400;d++){
    dd=new Date(today.getFullYear(),today.getMonth(),today.getDate()-d);
    if(dd<START) break;
    v=PROG[fmt(dd)];
    if(v && (v.l||v.o)){ run++; continue; }   /* 有完成 */
    if(isRestDay(dd)){ continue; }            /* 休息日：不断签、也不计天数 */
    if(d>0) break;                            /* 非休息日空缺 → 断 */
  }
  var a=document.getElementById("sk"), b=document.getElementById("td");
  if(a) a.textContent=run; if(b) b.textContent=cnt;
}

/* ── 全部训练清单 ── */
function renderList(){
  var el = document.getElementById('list'); if (!el) return;
  var t = document.getElementById('tot'); if (t) t.textContent = LESSONS.length;
  el.innerHTML = LESSONS.map(function(x, i){
    var no = (i < 9 ? '0' : '') + (i + 1);
    var now = (i === idx) ? ' now' : '';
    var tail = (i === idx) ? '<span class="tag">今天</span>' : '';
    return '<a class="it' + now + '" href="' + encodeURI(x.f) + '">'
      + '<span class="no">' + no + '</span>'
      + '<span class="tx">' + x.d.replace(' · ', ' · ') + tail + '</span>'
      + '<span class="ar">›</span></a>';
  }).join('');
}

/* ── 启动 ── */
renderHead();
renderTasks();
renderList();
refreshStats();

Promise.all([
  pull(),
  fetch("records.json?_="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.json(); }).catch(function(){ return {}; })
]).then(function(res){
  var remote = res[0], arch = res[1] || {};
  var before = JSON.stringify(PROG);
  PROG = mergeProg(BASE, loadLocal(), loadDone(), remote, arch.prog || {});
  saveLocal(PROG);
  if(JSON.stringify(PROG) !== before){ renderTasks(); refreshStats(); }
  setSync(remote !== undefined);
  push(PROG);                                            // 每次打开刷新云端有效期
});
</script>


<script>
/* 完成记录：训练包做完后自动写入，作战台据此自动打勾 */
(function(){
  window.__markDone = function(kind){
    var changed = false, d = {};
    try{
      var K='cet4_done', d2=JSON.parse(localStorage.getItem(K)||'{}');
      d = d2 || {};
      var t=new Date();
      var ds=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
      d[ds]=d[ds]||{};
      if(!d[ds][kind]){ d[ds][kind]=Date.now(); changed = true; }
      localStorage.setItem(K, JSON.stringify(d));
    }catch(e){}
    if(!changed) return;
    /* 完成即上云：最近 5 天快照推给云端，供首页累计 / Actions 归档 / 跨设备同步 */
    try{
      var snap={}, ks=Object.keys(d).sort().slice(-5), i;
      for(i=0;i<ks.length;i++){
        var v=d[ks[i]]||{};
        snap[ks[i]]={ l:v.listen?1:0, o:v.other?1:0, r:v.receipt?1:0 };
      }
      var x=new XMLHttpRequest();
      x.open('POST','https://ntfy.sh/cet4-718beb5773e8edd9ef48eb651cb1439dd362eb4a8d28f449',true);
      x.send(JSON.stringify(snap));
    }catch(e){}
  };
  /* 判分/回执上云成功 = 当天这一项完成 */
  var _f = window.fetch;
  window.fetch = function(u){
    var p = _f.apply(this, arguments);
    try{
      if (typeof u === 'string' && u.indexOf('ntfy.sh') >= 0 && !/(^|\/)(index|records)\.html$/.test(location.pathname)){
        p.then(function(r){
          if (r && r.ok){
            window.__markDone(/_Section/.test(location.pathname) ? 'listen' : 'other');
            window.__markDone('receipt');
          }
        }).catch(function(){});
      }
    }catch(e){}
    return p;
  };
})();
</script>
