<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四级备考作战台</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e6e8ec;--txt:#1c1e21;--sub:#6b7280;
 --blue:#2563eb;--blue-soft:#eff4ff;--green:#0d8a52;--green-soft:#e9f7ef;
 --amber:#b45309;--amber-soft:#fef6e7;--red:#c0392b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
 font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
 padding:16px 14px 44px;max-width:760px;margin:0 auto;}
h1{font-size:19px;margin:2px 0 14px;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:14px;}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.days{font-size:26px;font-weight:800;letter-spacing:-.5px}
.days small{font-size:13px;font-weight:500;color:var(--sub);margin-left:4px}
.stage{font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.bar{height:7px;background:#eceef2;border-radius:6px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.sub{font-size:12.5px;color:var(--sub)}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.box{flex:0 0 24px;width:24px;height:24px;border:2px solid #cbd2dc;border-radius:7px;
 margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;
 font-size:15px;color:#fff;user-select:none;transition:.15s}
.box.on{background:var(--green);border-color:var(--green)}
.box.on::after{content:"✓"}
.tk{flex:1;min-width:0}
.tt{font-size:15px;font-weight:600;line-height:1.45}
.td{font-size:13px;color:var(--sub);margin-top:3px}
.task.on .tt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c3c8d0}
.btn{display:inline-block;margin-top:9px;padding:9px 16px;border-radius:9px;background:var(--blue);
 color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.streak{display:flex;gap:18px;margin-top:4px}
.streak div{flex:1}
.streak b{font-size:22px;font-weight:800}
.note{font-size:13px;color:var(--amber);background:var(--amber-soft);border:1px solid #f0dfb8;
 border-radius:10px;padding:11px 13px;margin-top:12px;line-height:1.7}
.lh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;background:var(--card)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
a.it{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
 text-decoration:none;color:var(--txt);font-size:14.5px}
a.it:last-child{border-bottom:0}
a.it:active{background:var(--blue-soft)}
a.it .no{color:var(--sub);font-size:12.5px;min-width:24px}
a.it .tx{flex:1}
a.it .ar{color:#c3c8d0}
a.it.done{opacity:.5}
a.it.now{background:var(--green-soft)}
a.it.now .tx{font-weight:700;color:var(--green)}
.tag{font-size:11.5px;padding:2px 7px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:5px}
.hint{color:var(--sub);font-size:12.5px;margin:16px 2px 0;line-height:1.85}
</style>
</head>
<body>
<h1>四级备考作战台</h1>

<div class="card" id="head"></div>
<div class="card" id="tasks"></div>
<div class="list"><div class="lh">全部训练（<span id="tot"></span> 节）</div><div id="list"></div></div>

<div class="list">
  <div class="lh">阅读训练</div>
  <a class="it" href="reading.html"><span class="no">R</span><span class="tx">仔细阅读总览<span class="tag">8套15篇·含逐题解析与同义替换本</span></span><span class="ar">›</span></a>
</div>

<div class="list">
  <div class="lh">计划与专题</div>
  <a class="it" href="plan.html"><span class="no">0</span><span class="tx">备考计划总览<span class="tag">三阶段·每日模板·韧性规则</span></span><span class="ar">›</span></a>
  <div class="lh" style="border-top:1px solid var(--line)">方法与专题</div>
  <a class="it" href="method-5steps.html"><span class="no">1</span><span class="tx">精听五步法 · 操作卡 + 语音点专题<span class="tag">连读/弱读/失爆</span></span><span class="ar">›</span></a>
  <a class="it" href="digest.html"><span class="no">2</span><span class="tx">6 套真题提炼<span class="tag">信号词·吞音句·高频词</span></span><span class="ar">›</span></a>
  <a class="it" href="method-l1.html"><span class="no">3</span><span class="tx">三档语速辨音训练<span class="tag">慢速/原速/提速</span></span><span class="ar">›</span></a>
</div>

<div class="hint">
 <b>怎么用：</b>打开本页 → 按顺序做完勾掉 → 晚上回到对话交回执。<br>
 勾选状态存在本机，换设备不同步。进度按日期推算，漏做的那天从下面列表补。
</div>

<script>
var START = new Date(2026,9,15);        // 集训起点
var EXAMD = new Date(2026,11,12);       // 考试日
var LESSONS = [
  {f:"2025-12-1_SectionA.html",d:"2025年12月 第1套 · Section A 短篇新闻"},
  {f:"2025-12-1_SectionB.html",d:"2025年12月 第1套 · Section B 长对话"},
  {f:"2025-12-1_SectionC.html",d:"2025年12月 第1套 · Section C 听力篇章"},
  {f:"2025-06-2_SectionA.html",d:"2025年6月 第2套 · Section A 短篇新闻"},
  {f:"2025-06-2_SectionB.html",d:"2025年6月 第2套 · Section B 长对话"},
  {f:"2025-06-2_SectionC.html",d:"2025年6月 第2套 · Section C 听力篇章"},
  {f:"2025-06-1_SectionA.html",d:"2025年6月 第1套 · Section A 短篇新闻"},
  {f:"2025-06-1_SectionB.html",d:"2025年6月 第1套 · Section B 长对话"},
  {f:"2025-06-1_SectionC.html",d:"2025年6月 第1套 · Section C 听力篇章"},
  {f:"2024-06-1_SectionA.html",d:"2024年6月 第1套 · Section A 短篇新闻"},
  {f:"2024-06-1_SectionB.html",d:"2024年6月 第1套 · Section B 长对话"},
  {f:"2024-06-1_SectionC.html",d:"2024年6月 第1套 · Section C 听力篇章"},
  {f:"2023-12-1_SectionA.html",d:"2023年12月 第1套 · Section A 短篇新闻"},
  {f:"2023-12-1_SectionB.html",d:"2023年12月 第1套 · Section B 长对话"},
  {f:"2023-12-1_SectionC.html",d:"2023年12月 第1套 · Section C 听力篇章"},
  {f:"2023-06-1_SectionA.html",d:"2023年6月 第1套 · Section A 短篇新闻"},
  {f:"2023-06-1_SectionB.html",d:"2023年6月 第1套 · Section B 长对话"},
  {f:"2023-06-1_SectionC.html",d:"2023年6月 第1套 · Section C 听力篇章"},
  {f:"2023-06-2_SectionA.html",d:"2023年6月 第2套 · Section A 短篇新闻"},
  {f:"2023-06-2_SectionB.html",d:"2023年6月 第2套 · Section B 长对话"},
  {f:"2023-06-2_SectionC.html",d:"2023年6月 第2套 · Section C 听力篇章"},
  {f:"2022-12-1_SectionA.html",d:"2022年12月 第1套 · Section A 短篇新闻"},
  {f:"2022-12-1_SectionB.html",d:"2022年12月 第1套 · Section B 长对话"},
  {f:"2022-12-1_SectionC.html",d:"2022年12月 第1套 · Section C 听力篇章"}
];
var STAGES = [[new Date(2026,9,15), new Date(2026,10,3), "筑基期 · 解决「听不清」", "盯听写留白，别看正确率"],
              [new Date(2026,10,4), new Date(2026,10,24), "强化期 · 解决「跟不上+做不对」", "篇章正确率目标 50%"],
              [new Date(2026,10,25),new Date(2026,11,11), "冲刺期 · 考场保温", "盯稳定性，别再上新材料"]];

function d0(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate());}
var today=d0(new Date());
var gap=Math.round((today-d0(START))/86400000);
var idx=Math.min(Math.max(gap,0),LESSONS.length-1);
var toExam=Math.round((d0(EXAMD)-today)/86400000);
var dayNo=gap+1;
var key="cet4_"+today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");

// 阶段
var st=null;
for(var i=0;i<STAGES.length;i++){ if(today>=d0(STAGES[i][0])&&today<=d0(STAGES[i][1])) st=STAGES[i]; }
if(!st) st = today<d0(STAGES[0][0]) ? STAGES[0] : STAGES[2];

// 今日其他任务（按星期）
var wd=today.getDay();  // 0=周日
var OTHER={0:"本周复盘（30 分钟）",1:"翻译 1 段（20 分钟）",2:"仔细阅读 1 篇（20 分钟）",
           3:"翻译 1 段（20 分钟）",4:"仔细阅读 1 篇（20 分钟）",5:"写作 1 篇（20 分钟）",
           6:"整套模考（另抽 2.5 小时，不计入 60 分钟）"}[wd];

// 读取勾选
var done={};
try{ done=JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){ done={}; }

// 头部
var totalDays=Math.round((d0(EXAMD)-d0(START))/86400000);
var pct=Math.min(100,Math.round((gap+1)/totalDays*100));
document.getElementById("head").innerHTML=
 '<div class="top"><div class="days">'+toExam+'<small>天后考试</small></div>'
 +'<div class="stage">'+st[2]+'</div></div>'
 +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
 +'<div class="sub">集训第 '+dayNo+' 天 / 共 '+totalDays+' 天 · '+(today.getMonth()+1)+'月'+today.getDate()+'日 周'+'日一二三四五六'[wd]+'</div>'
 +'<div class="note">本阶段重点：'+st[3]+'</div>';

// 任务
var lessonTxt = (gap>=LESSONS.length) ? "全部 24 节已排完 · 请在对话里说「扩充题库」"
                                       : LESSONS[idx].d;
var tHtml='';
tHtml+='<div class="task'+(done.l?" on":"")+'" data-k="l"><div class="box'+(done.l?" on":"")+'"></div>'
 +'<div class="tk"><div class="tt">听力精听 · 40 分钟</div>'
 +'<div class="td">'+lessonTxt+'</div>'
 +'<a class="btn" href="'+encodeURI(LESSONS[idx].f)+'">开始今天的训练 →</a></div></div>';
tHtml+='<div class="task'+(done.o?" on":"")+'" data-k="o"><div class="box'+(done.o?" on":"")+'"></div>'
 +'<div class="tk"><div class="tt">'+OTHER+'</div>'
 +'<div class="td">'+(wd===6?"这 2.5 小时单独抽时间":"占每天 60 分钟里的后 20 分钟")+'</div></div></div>';
tHtml+='<div class="task'+(done.r?" on":"")+'" data-k="r"><div class="box'+(done.r?" on":"")+'"></div>'
 +'<div class="tk"><div class="tt">回对话交回执 · 2 分钟</div>'
 +'<div class="td">做完回到对话把回执发出来，我给出错因归因和明天的调整</div></div></div>';
tHtml+='<div class="streak"><div><b id="sk">0</b><div class="sub">连续打卡（天）</div></div>'
 +'<div><b id="td">0</b><div class="sub">累计完成（天）</div></div></div>';
document.getElementById("tasks").innerHTML=tHtml;

// 勾选交互
document.querySelectorAll(".task").forEach(function(el){
 el.querySelector(".box").addEventListener("click",function(){
   var k=el.dataset.k;
   done[k]=!done[k];
   localStorage.setItem(key,JSON.stringify(done));
   el.classList.toggle("on",done[k]);
   this.classList.toggle("on",done[k]);
   refreshStats();
 });
});

function refreshStats(){
 var cnt=0,run=0;
 for(var d=0;d<400;d++){
   var dd=new Date(START.getFullYear(),START.getMonth(),START.getDate()+d);
   if(dd>today) break;
   var kk="cet4_"+dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
   var v=null; try{ v=JSON.parse(localStorage.getItem(kk)||"null"); }catch(e){}
   var ok = v && v.l && v.o;
   if(ok) cnt++;
 }
 // 连续
 for(var d=0;d<400;d++){
   var dd=new Date(today.getFullYear(),today.getMonth(),today.getDate()-d);
   var kk="cet4_"+dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
   var v=null; try{ v=JSON.parse(localStorage.getItem(kk)||"null"); }catch(e){}
   if(v && v.l && v.o) run++; else break;
 }
 document.getElementById("sk").textContent=run;
 document.getElementById("td").textContent=cnt;
}
refreshStats();

// 列表
document.getElementById("tot").textContent=LESSONS.length;
var h="";
for(var i=0;i<LESSONS.length;i++){
 var cls = i<idx ? "it done" : (i===idx ? "it now" : "it");
 var tag = i===idx ? '<span class="tag">今天</span>' : '';
 h+='<a class="'+cls+'" href="'+encodeURI(LESSONS[i].f)+'"><span class="no">'+(i+1)+'</span>'
   +'<span class="tx">'+LESSONS[i].d+tag+'</span><span class="ar">›</span></a>';
}
document.getElementById("list").innerHTML=h;
</script>
</body>
</html>
