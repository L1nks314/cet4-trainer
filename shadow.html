<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跟读 · 3 句</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --soft:#fafbfc; --line:#e5e8ec; --line2:#eff1f4;
    --txt:#1b1e23; --txt2:#3d434e; --sub:#6b7280; --sub2:#a8b0bb;
    --blue:#2563eb; --blue-soft:#eef3ff; --green:#0d8a52; --green-soft:#e8f7ef;
    --amber:#b45309; --amber-soft:#fef6e7;
    --r:12px; --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);
       font:400 15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}

  header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;
         background:var(--card);border-bottom:1px solid var(--line)}
  header .back{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
       background:var(--soft);color:var(--txt2);font-size:16px;line-height:1;
       display:flex;align-items:center;justify-content:center;text-decoration:none;flex:0 0 auto}
  header .ttl{flex:1;min-width:0;font-weight:600;font-size:13.5px;color:var(--txt2);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .rt{flex:0 0 auto;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);
       background:var(--soft);color:var(--sub);font:600 12.5px/32px inherit}

  main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 0;overflow:auto}

  .bar{flex:0 0 auto;margin-bottom:12px}
  .dots{display:flex;gap:5px;margin-bottom:8px}
  .dots i{flex:1;height:5px;border-radius:3px;background:#dfe3ea}
  .dots i.on{background:var(--blue)}
  .dots i.ok{background:#8fb0ea}
  .bt{font:700 15px/1.35 inherit;color:var(--txt)}
  .bd{font:400 12.5px/1.6 inherit;color:var(--sub);margin-top:3px}

  .card{flex:0 1 auto;min-height:0;max-height:none;margin:16px 0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;
        box-shadow:var(--shadow);padding:22px 16px;display:flex;flex-direction:column;
        justify-content:center;gap:12px;overflow:auto}

  .q{font:600 16px/1.5 inherit;color:var(--txt);text-align:center}
  .q small{display:block;font:400 12.5px/1.6 inherit;color:var(--sub2);margin-top:5px;font-weight:400}

  .en{font:400 17px/1.85 Georgia,"Times New Roman",serif;color:var(--txt2);
      text-align:left;padding:12px 13px;border-radius:10px;background:var(--soft);
      border:1px solid var(--line2)}
  .en .w{white-space:nowrap}
  .en .w.hl{background:#fff2a8;border-radius:3px;padding:0 1px}
  .en .gap{color:var(--sub2);font-weight:700;padding:0 3px}

  .zh{font:400 14px/1.7 inherit;color:var(--sub);padding:10px 12px;border-radius:10px;
      background:var(--amber-soft);border:1px solid #f3e4c4;display:none}
  .zh.on{display:block}

  .segs{display:flex;flex-direction:column;gap:7px}
  .segs .sg{padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--soft);
       font:400 14.5px/1.55 Georgia,serif;color:var(--sub)}
  .segs .sg.on{border-color:#c7d7fb;background:var(--blue-soft);color:var(--txt2);font-weight:600}
  .segs .sg.done{color:var(--sub2)}

  .hint2{font:400 12.5px/1.65 inherit;color:var(--sub2);text-align:center}
  .hint2 b{color:var(--blue)}

  textarea{width:100%;min-height:92px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
       background:var(--soft);font:400 14px/1.6 inherit;color:var(--txt);resize:vertical}

  footer{flex:0 0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
  .mainb{width:100%;padding:14px;border-radius:12px;border:0;background:var(--blue);color:#fff;
       font:700 15.5px/1.2 inherit;box-shadow:0 6px 16px rgba(37,99,235,.2)}
  .mainb:disabled{background:#c8d3e6;box-shadow:none}
  .row{display:flex;gap:8px;margin-top:8px}
  .row button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card);
       color:var(--txt2);font:600 13.5px/1.2 inherit}
  .row button:disabled{color:var(--sub2);background:#f0f1f3}
  .row button.go{background:var(--green-soft);border-color:#bfe3cf;color:var(--green)}

  .toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:60;display:none;
       background:rgba(27,30,35,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px}
  .toast.on{display:block}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html" title="回首页">←</a>
  <div class="ttl" id="ttl">跟读 · 3 句</div>
  <button class="rt" id="rt">1.0×</button>
</header>

<main>
  <div class="bar">
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="bt" id="bt">加载中…</div>
    <div class="bd" id="bd"></div>
  </div>
  <div class="card" id="card"></div>
</main>

<footer>
  <button class="mainb" id="main" disabled>▶ 开始</button>
  <div class="row">
    <button id="again" disabled>↻ 再来一遍</button>
    <button id="next" disabled>下一步 →</button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<audio id="au" preload="auto"></audio>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var FILE = q.get('p') || '';
  var SKEY = q.get('k') || '';

  var au = document.getElementById('au');
  var elTtl = document.getElementById('ttl');
  var elDots = document.getElementById('dots');
  var elBt = document.getElementById('bt'), elBd = document.getElementById('bd');
  var elCard = document.getElementById('card');
  var bMain = document.getElementById('main'), bAgain = document.getElementById('again'), bNext = document.getElementById('next');
  var elRt = document.getElementById('rt');
  var toast = document.getElementById('toast');

  var DATA = null, LINES = [], picks = [], n = 0;
  var idx = 0, step = 1, seg = 0;
  var rate = 1.0;
  var playing = false, timer = 0, pass = 0, passTotal = 0;
  var segs = [], allDone = false, segAllDone = false;

  function say(t){
    toast.textContent = t; toast.classList.add('on');
    clearTimeout(say._t); say._t = setTimeout(function(){ toast.classList.remove('on'); }, 1800);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function toks(){
    var l = LINES[picks[idx]] || {};
    return l.tokens || [];
  }

  /* ── 从听力页抓 DATA ── */
  function pickData(html){
    var i = html.indexOf('var DATA');
    if (i < 0) return null;
    var j = html.indexOf('{', i);
    if (j < 0) return null;
    var depth = 0, inStr = false, escp = false, k;
    for (k = j; k < html.length; k++){
      var ch = html[k];
      if (inStr){
        if (escp) escp = false;
        else if (ch === '\\') escp = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"'){ inStr = true; continue; }
      if (ch === '{') depth++;
      else if (ch === '}'){ depth--; if (depth === 0) break; }
    }
    if (depth !== 0) return null;
    try{ return JSON.parse(html.slice(j, k + 1)); }catch(e){ return null; }
  }

  function useless(en){
    en = String(en || '').trim();
    if (!en) return true;
    if (/[\u4e00-\u9fa5]/.test(en)) return true;
    if (/^(news report|passage|conversation|section|directions)\b/i.test(en)) return true;
    if (en.split(/\s+/).length <= 2 && en.length < 16) return true;
    return false;
  }

  /* 与听力页「今天写这 3 句」同一批：优先读它写下的 picks */
  function pickLines(){
    var want = [];
    try{
      var raw = JSON.parse(localStorage.getItem('cet4_pick_' + FILE) || 'null');
      if (raw && raw.length){ want = raw; }
    }catch(e){}
    var out = [];
    for (var i = 0; i < want.length; i++){
      if (LINES[want[i]] && !useless(LINES[want[i]].en)) out.push(want[i]);
    }
    if (out.length) return out.slice(0, 3);
    /* 没记录就自己挑：中长句、实词多、分散在全篇 */
    var scored = [];
    for (var j = 0; j < LINES.length; j++){
      if (useless(LINES[j].en)) continue;
      var t = LINES[j].en.replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean);
      var sc = t.length + (LINES[j].en.match(/[,;]/g) || []).length * 1.5;
      if (t.length >= 7 && t.length <= 20) sc += 3;
      scored.push({ i: j, s: sc });
    }
    scored.sort(function(a, b){ return b.s - a.s; });
    var band = Math.ceil(scored.length / 3), res = [];
    for (var b2 = 0; b2 < 3; b2++){
      var pool = scored.slice(b2 * band, (b2 + 1) * band);
      if (pool.length) res.push(pool[0].i);
    }
    return res.sort(function(a, b){ return a - b; });
  }

  /* ── 意群切分：短句不切，长句按标点 + 5–8 词 ── */
  function cutSegs(tk){
    var len = tk.length;
    if (len <= 12) return [];
    var raw = [], s = 0;
    for (var i = 0; i < len; i++){
      if (/[,;:.!?]$/.test(tk[i].w) && (i - s + 1) >= 3){
        raw.push([s, i]); s = i + 1;
      }
    }
    if (s < len) raw.push([s, len - 1]);
    var merged = [];
    for (var r = 0; r < raw.length; r++){
      var cur = raw[r];
      if (merged.length && (cur[1] - cur[0] + 1) < 3){
        merged[merged.length - 1][1] = cur[1];
      } else merged.push([cur[0], cur[1]]);
    }
    var fin = [];
    for (var m = 0; m < merged.length; m++){
      var a = merged[m][0], b = merged[m][1];
      if (b - a + 1 > 10){
        for (var x = a; x <= b; x += 7) fin.push([x, Math.min(b, x + 6)]);
      } else fin.push([a, b]);
    }
    if (fin.length === 1) return [];
    /* 段太多会变成体力活：39 词的句子切成 7 段就是 14 遍，跟到后面只是机械重复 */
    if (fin.length > 6){
      var lim = [], per = Math.ceil(fin.length / 6);
      for (var q = 0; q < fin.length; q += per){
        lim.push([fin[q][0], fin[Math.min(fin.length - 1, q + per - 1)][1]]);
      }
      fin = lim;
    }
    return fin;
  }

  function segTime(sg){
    var tk = toks();
    var a = tk[sg[0]] ? tk[sg[0]].s : 0;
    var e = tk[sg[1]] ? (tk[sg[1]].e || (tk[sg[1]].s + 1)) : a + 1;
    var nx = tk[sg[1] + 1] ? tk[sg[1] + 1].s : e + 0.3;
    return [Math.max(0, a - 0.05), (nx && nx > a) ? nx - 0.03 : e + 0.3];
  }
  function lineTime(){
    var tk = toks();
    if (!tk.length) return [0, (DATA && DATA.dur) || 1];
    var a = tk[0].s, last = tk[tk.length - 1];
    var e = last.e || (last.s + 1);
    return [Math.max(0, a - 0.12), e + 0.25];
  }

  /* ── 播放 ── */
  function seekTo(t, cb){
    t = Math.max(0, t);
    var run = function(){ try{ au.currentTime = t; }catch(e){} if (cb) cb(); };
    if (au.readyState >= 1) return run();
    var fired = false;
    var once = function(){
      if (fired) return; fired = true;
      au.removeEventListener('loadedmetadata', once);
      run();
    };
    au.addEventListener('loadedmetadata', once);
    setTimeout(function(){ if (!fired && au.readyState >= 1) once(); }, 1500);
  }

  function stopT(){ if (timer){ clearInterval(timer); timer = 0; } }

  function playRange(a, b, times, gap, onEnd){
    stopT();
    playing = true; pass = 0; passTotal = times; paintBtns();
    var done = 0;
    function once(){
      if (!playing) return;
      seekTo(a, function(){
        try{ au.playbackRate = rate; }catch(e){}
        au.play().catch(function(){});
        stopT();
        timer = setInterval(function(){
          if (!playing){ stopT(); return; }
          if (au.currentTime >= b - 0.03 || au.ended){
            au.pause(); stopT();
            done++; pass = done; paintPass();
            if (done < times){
              setTimeout(function(){ if (playing) once(); }, gap);
            } else {
              playing = false; paintBtns();
              if (onEnd) onEnd();
            }
          }
        }, 55);
      });
    }
    once();
  }

  function hardStop(){
    playing = false; stopT();
    try{ au.pause(); }catch(e){}
    paintBtns();
  }

  /* ── 步骤文案 ── */
  function stepInfo(){
    if (step === 1){
      return { t:'① 先听懂，别看字',
               d:'听 2 遍，然后用中文在脑子里说一句「这句在讲什么」。说得粗没关系，必须有个意思。' };
    }
    if (step === 2){
      return { t:'② 拆意群跟读',
               d: segs.length ? '一段一段跟，每段播 2 遍。跟丢就等下一段，别回头补。'
                              : '这句短，直接整句跟 2 遍。' };
    }
    if (step === 3){
      return { t:'③ 整句跟，撤掉文本',
               d:'整句播 2 遍，你跟着说。中间不许停、不许回头想词，想不起来就用 na-na 带过去。' };
    }
    return { t:'④ 关掉音频，复述整组',
             d:'用中文把这 3 句连起来说一遍。说不出就说明刚才跟读时脑子是空的，明天回炉这几句。' };
  }

  function paintHead(){
    var inf = stepInfo();
    elBt.textContent = (step === 4 ? '' : ('第 ' + (idx + 1) + ' / ' + n + ' 句 · ')) + inf.t;
    elBd.textContent = inf.d;
    var ds = elDots.children;
    for (var i = 0; i < ds.length; i++){
      ds[i].className = '';
      if (i + 1 === step) ds[i].className = 'on';
      else if (i + 1 < step) ds[i].className = 'ok';
    }
  }

  function paintPass(){
    if (!passTotal) return;
    bMain.textContent = '🔊 第 ' + Math.min(pass + 1, passTotal) + ' / ' + passTotal + ' 遍';
  }

  function paintBtns(){
    bMain.disabled = false;
    bMain.textContent = playing ? '⏸ 暂停' : '▶ 开始';
    if (playing) return;
    if (step === 1) bMain.textContent = '▶ 听 2 遍';
    if (step === 2) bMain.textContent = segs.length ? '▶ 逐段跟' : '▶ 整句跟 2 遍';
    if (step === 3) bMain.textContent = '▶ 整句跟 2 遍';
    if (step === 4) bMain.textContent = '（不用播，直接复述）';
    if (step === 4) bMain.disabled = true;
    bAgain.disabled = (step === 4);
    bNext.disabled = !canNext();
    bNext.classList.toggle('go', step === 4);
    bNext.textContent = (step === 4) ? '完成，回首页' : '下一步 →';
  }

  var stepDone = { 1:false, 2:false, 3:false };

  function canNext(){
    if (step === 4) return true;
    return !!stepDone[step];
  }

  /* ── 渲染 ── */
  function renderEn(hlSeg){
    var tk = toks(), h = '';
    var from = -1, to = -1;
    if (hlSeg){ from = hlSeg[0]; to = hlSeg[1]; }
    for (var i = 0; i < tk.length; i++){
      var cls = 'w' + ((from >= 0 && i >= from && i <= to) ? ' hl' : '');
      h += '<span class="' + cls + '">' + esc(tk[i].w) + '</span> ';
    }
    return '<div class="en">' + h + '</div>';
  }

  function paint(){
    paintHead();
    var l = LINES[picks[idx]] || {};
    var h = '';
    if (step === 1){
      h += '<div class="q">先别管拼写，听声音<small>播完 2 遍，用中文说出这句在讲什么</small></div>';
      if (stepDone[1]) h += '<div class="zh on">' + esc(l.zh || l.cn || '（这段没有译文）') + '</div>';
      if (stepDone[1]) h += '<div class="hint2">刚才你脑子里的意思，和上面这句对得上吗？<b>对不上就再听一遍</b>。</div>';
    } else if (step === 2){
      if (segs.length){
        h += '<div class="segs">';
        for (var i = 0; i < segs.length; i++){
          var tx = [];
          for (var k = segs[i][0]; k <= segs[i][1]; k++) tx.push(esc(toks()[k].w));
          h += '<div class="sg' + (i === seg ? ' on' : (i < seg ? ' done' : '')) + '">' + tx.join(' ') + '</div>';
        }
        h += '</div>';
        h += '<div class="hint2">现在跟第 <b>' + Math.min(seg + 1, segs.length) + '</b> 段（共 ' + segs.length + ' 段）</div>';
      } else {
        h += renderEn(null);
        h += '<div class="hint2">短句，整句跟 2 遍就行</div>';
      }
    } else if (step === 3){
      h += '<div class="q">撤掉文本，整句跟 2 遍<small>跟丢也别停，顺着往下走</small></div>';
      h += '<div class="zh' + (stepDone[3] ? ' on' : '') + '">' + esc(l.en || '') + '</div>';
      if (stepDone[3]) h += '<div class="hint2">跟完了。刚才<b>有没有一边跟一边知道意思</b>？只是嘴在动就是白跟。</div>';
    } else {
      h += '<div class="q">用中文把这 3 句连起来说一遍<small>可以写下来，也可以只说不动笔</small></div>';
      h += '<div class="segs">';
      for (var m = 0; m < picks.length; m++){
        var z = LINES[picks[m]] || {};
        h += '<div class="sg">' + esc(z.zh || z.cn || '') + '</div>';
      }
      h += '</div>';
      h += '<textarea id="ta" placeholder="写不写都行。写下来更容易看出哪句其实没懂。"></textarea>';
    }
    elCard.innerHTML = h;
    paintBtns();
  }

  function goStep(s){
    hardStop();
    step = s;
    if (s === 2){
      segs = cutSegs(toks()); seg = 0; segAllDone = false;
    }
    paint();
  }

  function nextLine(){
    if (idx + 1 < n){
      idx++; step = 1; stepDone = { 1:false, 2:false, 3:false };
      segs = []; seg = 0;
      paint();
    } else {
      goStep(4);
    }
  }

  /* ── 主动作 ── */
  function act(){
    if (playing){ hardStop(); return; }
    if (step === 1){
      playRange(lineTime()[0], lineTime()[1], 2, 900, function(){
        stepDone[1] = true; paint();
      });
      elCard.innerHTML = '<div class="q">正在播，别急着看字<small>听完脑子里留一句中文意思</small></div>';
      paintBtns();
    } else if (step === 2 && segs.length){
      playSegs(0);
    } else if (step === 2){
      playRange(lineTime()[0], lineTime()[1], 2, 900, function(){
        stepDone[2] = true; paint();
      });
    } else if (step === 3){
      playRange(lineTime()[0], lineTime()[1], 2, 1600, function(){
        stepDone[3] = true; paint();
      });
      elCard.innerHTML = '<div class="q">整句跟 2 遍<small>嘴不要停，跟不上就跟后半句</small></div>';
      paintBtns();
    }
  }

  function playSegs(from){
    var i = from;
    function run(){
      if (i >= segs.length){
        seg = segs.length;
        playRange(lineTime()[0], lineTime()[1], 1, 300, function(){
          stepDone[2] = true; paint();
        });
        elBt.textContent = '整句再串一遍';
        return;
      }
      seg = i; paint();
      var t = segTime(segs[i]);
      playRange(t[0], t[1], 2, 1400, function(){
        i++; run();
      });
    }
    run();
  }

  /* ── 记录完成 ── */
  function markFlow(){
    if (!SKEY) return;
    var d = new Date();
    var ymd = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    try{
      var o = JSON.parse(localStorage.getItem('cet4_steps_' + ymd) || '{}') || {};
      o[SKEY] = 1;
      localStorage.setItem('cet4_steps_' + ymd, JSON.stringify(o));
    }catch(e){}
    try{
      var p = JSON.parse(localStorage.getItem('cet4_shadow_v1') || '{}') || {};
      p[FILE] = { at: d.getTime(), n: n, li: picks.slice() };
      localStorage.setItem('cet4_shadow_v1', JSON.stringify(p));
    }catch(e){}
  }

  /* ── 事件 ── */
  bMain.addEventListener('click', act);
  bAgain.addEventListener('click', function(){
    if (step === 2 && segs.length){ playSegs(0); return; }
    act();
  });
  bNext.addEventListener('click', function(){
    if (!canNext()){ say('先做完这一步'); return; }
    if (step === 4){ markFlow(); location.href = 'index.html?done=shadow'; return; }
    if (step === 3){ nextLine(); return; }
    goStep(step + 1);
  });
  elRt.addEventListener('click', function(){
    rate = (rate === 1.0) ? 0.9 : 1.0;
    elRt.textContent = rate.toFixed(1) + '×';
    try{ au.playbackRate = rate; }catch(e){}
  });

  /* ── 启动 ── */
  if (!FILE){
    elBt.textContent = '缺少参数';
    elBd.textContent = '请从首页「去跟读」进入';
    return;
  }
  fetch(FILE, { cache: 'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(html){
      DATA = pickData(html);
      if (!DATA || !DATA.lines || !DATA.lines.length){
        elBt.textContent = '读取音频数据失败';
        elBd.textContent = '回首页重进一次，或直接打开听力页练';
        return;
      }
      LINES = DATA.lines;
      var src = (DATA.rates && DATA.rates[0] && DATA.rates[0].src) || '';
      if (!src){ elBt.textContent = '这一页没有音频'; return; }
      au.src = src;
      picks = pickLines();
      n = picks.length;
      if (!n){ elBt.textContent = '没找到可跟读的句子'; return; }
      var m = html.match(/<title>([^<]*)<\/title>/);
      if (m){
        var nm = m[1].replace(/\s*·\s*四级.*$/, '').replace(/\s*·\s*Section\s*[A-C].*$/i, '')
                       .replace(/\s*·\s*$/, '').trim().slice(0, 16);
        elTtl.textContent = '跟读 · ' + n + ' 句 · ' + nm;
      }
      step = 1;
      paintHead();
      elCard.innerHTML = '<div class="q">今天跟这 ' + n + ' 句<small>和今天听写的是同一批句子</small></div>'
        + '<div class="hint2">① 听懂 → ② 拆意群跟 → ③ 整句跟 → ④ 复述<br>每句走完前三步，最后统一复述</div>';
      bMain.disabled = false;
      bAgain.disabled = false;
      bNext.disabled = true;
      paintBtns();
    })
    .catch(function(){
      elBt.textContent = '加载失败';
      elBd.textContent = '检查网络后重试';
    });
})();
</script>
</body>
</html>
