<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音义闪卡 · 四级听力</title>
<style>
:root{
  --bg:#f6f4ee; --card:#fffdf8; --txt:#1b1e23; --sub:#6b7280; --line:#e4dfd3;
  --blue:#2563eb; --green:#12805c; --red:#b4351f; --soft:#f1ece0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:720px;padding:14px 18px 6px;display:flex;align-items:center;gap:10px}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px}
header .src{font-size:12px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header a{font-size:12.5px;color:var(--sub);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
main{width:100%;max-width:720px;flex:1;padding:6px 18px 30px;display:flex;flex-direction:column;justify-content:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;margin-top:10px}
.meta{width:100%;display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.bar{width:100%;height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .1s linear}

.play{margin:6px auto 18px;width:132px;height:132px;border-radius:50%;border:none;background:var(--blue);color:#fff;
  font-size:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 10px 24px rgba(37,99,235,.22)}
.play:active{transform:scale(.97)}
.hint{font-size:13px;color:var(--sub);text-align:center;margin:0 0 18px}
.hint b{color:var(--txt)}
.count{font-size:13px;color:var(--sub);margin-bottom:4px;text-align:center}
#ask{width:100%}
.count b{font-size:22px;color:var(--txt);font-variant-numeric:tabular-nums}

.acts{display:flex;gap:12px;width:100%;max-width:420px}
.acts button{flex:1;padding:15px 10px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--txt)}
.acts button.ok{border-color:#bcd9cc;background:#f2faf6;color:var(--green)}
.acts button.no{border-color:#eccfc6;background:#fdf4f1;color:var(--red)}
.acts button:active{transform:scale(.985)}

.answer{width:100%;display:none}
.answer.on{display:block}
.word{font-size:34px;font-weight:800;letter-spacing:.4px;text-align:center;margin:2px 0 4px;word-break:break-word;cursor:pointer}
.replay{display:block;margin:0 auto;padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);
  background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
.rowplay{display:flex;gap:10px;justify-content:center;margin:0 auto 14px}
.pos{text-align:center;font-size:12px;color:var(--sub);margin-bottom:18px}
.sent{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.7;margin-bottom:10px}
.sent b{color:var(--blue);background:#e7eefd;border-radius:4px;padding:0 2px}
.cn{font-size:14px;color:var(--sub);line-height:1.7;padding:0 2px}
.next{width:100%;max-width:420px;margin:22px auto 0;padding:15px;border-radius:12px;border:none;
  background:var(--txt);color:#fff;font-size:16px;font-weight:700;cursor:pointer}

.start{width:100%;max-width:420px;margin:26px auto 0;padding:17px;border-radius:12px;border:none;
  background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.start:disabled{opacity:.5}

.done{display:none;text-align:center}
.done.on{display:block}
.done .big{font-size:46px;font-weight:800;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.done .sub{color:var(--sub);font-size:13.5px;margin-bottom:20px}
.wrongs{text-align:left;background:var(--soft);border-radius:12px;padding:14px 16px;margin:0 0 16px;max-height:42vh;overflow:auto}
.wrongs div{padding:8px 0;border-bottom:1px solid #e6e0d3;font-size:15px}
.wrongs div:last-child{border-bottom:none}
.wrongs span{color:var(--sub);font-size:13px;display:block;margin-top:2px}
.wrongs button{border:none;background:none;color:var(--blue);font-size:13px;padding:0;margin-left:10px;cursor:pointer}
.row2{display:flex;gap:12px;max-width:420px;margin:0 auto}
.row2 button{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff}
.row2 button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
footer{font-size:11.5px;color:var(--sub);text-align:center;padding:0 18px 22px;max-width:720px}
@media (max-width:420px){
  .card{padding:20px 14px;min-height:300px}
  .play{width:112px;height:112px;font-size:38px}
  .word{font-size:28px}
}
</style>
</head>
<body>

<header>
  <h1>音义闪卡</h1>
  <span class="src" id="src">加载中…</span>
  <a href="index.html">返回</a>
</header>

<main>
  <div class="card" id="card">
    <div class="meta"><span id="page">— / —</span><span id="state">听音 → 说中文</span></div>
    <div class="bar"><i id="bar"></i></div>

    <div id="ask">
      <button class="play" id="play" aria-label="播放单词">🔊</button>
      <p class="hint">听发音，<b>3 秒内</b>说出中文。想不起来就点「没反应」，别硬想。</p>
      <div class="count">还剩 <b id="sec">3</b> 秒</div>
    </div>

    <div class="answer" id="answer">
      <div class="word" id="word">—</div>
      <div class="rowplay">
        <button class="replay" id="play2">🔊 原声再听</button>
        <button class="replay" id="playSent">🎧 听整句</button>
      </div>
      <div class="pos" id="pos"></div>
      <div class="sent" id="sent"></div>
      <div class="cn" id="cn"></div>
    </div>

    <div class="acts" id="acts">
      <button class="ok" id="btnOk">想起来了</button>
      <button class="no" id="btnNo">没反应</button>
    </div>
    <button class="next" id="btnNext" style="display:none">下一个 →</button>
  </div>

  <div class="card done" id="done">
    <div class="big" id="rate">0%</div>
    <div class="sub" id="rateSub">—</div>
    <div class="wrongs" id="wrongList"></div>
    <div class="row2">
      <button id="againWrong">只练错的</button>
      <button class="primary" id="againAll">再来一轮</button>
    </div>
  </div>

  <button class="start" id="btnStart">开始（20 个词）</button>
</main>

<footer>词与例句都取自这一段的原文；发音直接从这段真题录音里切出来（不是合成音），听到的就是考试里的那个声音。</footer>

<script>
(function(){
  var STOP = {};
  ('a an the this that these those there here it its they them their themself ourselves you your yours we our ours he him his she her hers i me my mine '
  +'is am are was were be been being do does did done have has had having will would shall should can could may might must '
  +'and or but so if because as than then that which who whom whose what when where why how all any both each few more most other some such no nor not only own same too very '
  +'about above across after against along among around at before behind below beneath beside between beyond by down during except for from in inside into like near of off on onto out outside over past since through throughout till to toward under until up upon with within without '
  +'also just even still yet again ever never always often sometimes usually already almost enough quite rather really perhaps maybe however therefore thus hence instead although though while whereas whether either neither '
  +'one two three four five six seven eight nine ten first second third next last another each every many much little few lot lots '
  +'say says said says go goes going went gone get gets getting got make makes making made take takes taking took taken come comes coming came know knows knowing knew known think thinks thinking thought see sees seeing saw seen want wants wanting wanted use uses using used find finds finding found give gives giving gave given tell tells telling told work works working worked call calls calling called try tries trying tried ask asks asking asked need needs needing needed feel feels feeling felt become becomes becoming became leave leaves leaving left put puts putting keep keeps keeping kept let lets letting mean means meaning meant begin begins beginning began begun seem seems seeming seemed help helps helping helped talk talks talking talked turn turns turning turned start starts starting started show shows showing showed shown hear hears hearing heard play plays playing played run runs running ran move moves moving moved live lives living lived believe believes believing believed hold holds holding held bring brings bringing brought happen happens happening happened write writes writing wrote written provide provides providing provided sit sits sitting sat stand stands standing stood lose loses losing lost pay pays paying paid meet meets meeting met include includes including included continue continues continuing continued set sets setting learn learns learning learned change changes changing changed lead leads leading led understand understands understanding understood watch watches watching watched follow follows following followed stop stops stopping stopped create creates creating created speak speaks speaking spoke spoken read reads reading remember remembers remembering remembered consider considers considering considered appear appears appearing appeared buy buys buying bought wait waits waiting waited serve serves serving served die dies dying died send sends sending sent expect expects expecting expected build builds building built stay stays staying stayed fall falls falling fell fallen cut cuts cutting grow grows growing grew grown open opens opening opened win wins winning won offer offers offering offered walk walks walking walked '
  +'passage section question answer answers university research researchers study studies students people person time year years day days way ways thing things part parts place places case cases point points number numbers group groups problem problems fact facts world life lives hand hands eye eyes head face house home school country countries government company companies system systems program programs water light air word words book books story stories name names room door car cars city cities area areas money job jobs health food music history science language languages')
    .split(/\s+/).forEach(function(w){ if (w) STOP[w] = 1; });

  var q = new URLSearchParams(location.search);
  var want = parseInt(q.get('n') || '20', 10);
  if (!(want >= 5 && want <= 30)) want = 20;
  var page = q.get('p') || '';
  var SKEY = q.get('k') || '';
  if (!page){
    try{ var cs = JSON.parse(localStorage.getItem('cet4_curseg') || 'null'); if (cs && cs.f) page = cs.f; }catch(e){}
  }
  if (!page) page = '2025-06-1_SectionC.html';

  var srcEl = document.getElementById('src');
  srcEl.textContent = page.replace(/\.html$/, '').replace(/_/g, ' ');

  var all = [], deck = [], idx = 0, ok = 0, wrong = [], timer = 0, deadline = 0, revealed = false, running = false;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- 原声切片 ---------- */
  var SRC = '', DATA = null;              /* 当前段的音频地址 / 词级时间轴 */
  var AU = new Audio(), AUReady = false, rafId = 0, clipEnd = 0, unlocked = false;
  AU.preload = 'auto';

  /* 系统语音只作兜底：页面里没有时间轴时才用 */
  function speak(w){
    try{
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(w);
      u.lang = 'en-US';
      u.rate = 0.92;
      u.pitch = 1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  function tick(){
    rafId = 0;
    if (AU.paused) return;
    if (AU.seeking){ rafId = requestAnimationFrame(tick); return; }
    if (AU.currentTime >= clipEnd){ AU.pause(); return; }
    rafId = requestAnimationFrame(tick);
  }

  function stopClip(){
    cancelAnimationFrame(rafId); rafId = 0;
    try{ AU.pause(); }catch(e){}
  }

  /* iOS 要一次手势内的播放来解锁，否则倒计时结束时自动播会被拦 */
  var unlockPending = false;
  function unlock(){
    if (unlocked || !SRC) return;
    unlocked = true; unlockPending = true;
    try{
      AU.muted = true;
      var p = AU.play();
      var fin = function(){
        AU.muted = false;
        if (unlockPending){
          unlockPending = false;
          try{ AU.pause(); AU.currentTime = 0; }catch(e){}
        }
      };
      if (p && p.then) p.then(fin).catch(function(){ AU.muted = false; unlockPending = false; });
      else setTimeout(fin, 50);
    }catch(e){ AU.muted = false; unlockPending = false; }
  }

  /* 播 [s,e] 秒的原声；whole=true 播整句 */
  function playClip(it, whole){
    if (!it){ return; }
    if (!SRC || !DATA){ speak(it.w); return; }
    unlockPending = false;
    AU.muted = false;
    var s = whole ? it.ns : it.s;
    var e = whole ? it.ne : it.e;
    if (typeof s !== 'number' || typeof e !== 'number'){ speak(it.w); return; }
    /* 词头留 0.14s：ASR 标的起点在爆破之后，切太齐会把 b/d/p/t 的闭塞吃掉 */
    s = Math.max(0, s - (whole ? 0.20 : 0.14));
    e = e + (whole ? 0.30 : 0.15);
    try{
      stopClip();
      var go = function(){
        try{ AU.currentTime = s; }catch(err){}
        clipEnd = e;
        var p = AU.play();
        if (p && p.catch) p.catch(function(){});
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(tick);
      };
      if (AU.readyState >= 1) go();
      else {
        AU.addEventListener('loadedmetadata', function once(){
          AU.removeEventListener('loadedmetadata', once); go();
        });
      }
    }catch(err){ speak(it.w); }
  }

  /* 从页面 HTML 里取 DATA（里面有每个词的起止时间） */
  function parseDATA(html){
    var i = html.indexOf('var DATA = ');
    if (i < 0) return null;
    var j = html.indexOf('{', i), d = 0, inStr = false, escd = false;
    for (var k = j; k < html.length; k++){
      var c = html.charAt(k);
      if (inStr){
        if (escd) escd = false;
        else if (c === '\\') escd = true;
        else if (c === '"') inStr = false;
      } else if (c === '"') inStr = true;
      else if (c === '{') d++;
      else if (c === '}'){
        d--;
        if (d === 0){ try{ return JSON.parse(html.slice(j, k + 1)); }catch(e){ return null; } }
      }
    }
    return null;
  }

  var WMIN = 0.22, WMAX = 1.10;

  function normTok(w){
    return String(w || '').toLowerCase().replace(/^[^a-z]+/, '').replace(/[^a-z]+$/, '');
  }

  /* 行首若是 "News Report 1" / "Passage 2" 这类标题，返回正文起始下标 */
  function headSkip(tk){
    var w0 = String(tk[0] && tk[0].w || '').toLowerCase();
    if (!/^(news|passage|section|conversation|questions?|directions?)$/.test(w0)) return 0;
    for (var i = 0; i < Math.min(tk.length, 5); i++){
      if (/^\d+\.?$/.test(tk[i].w)) return i + 1;
    }
    return 0;
  }

  function build(lines){
    var map = {};
    lines.forEach(function(ln, li){
      var tk = ln.tokens || [];
      /* 同一句里好几个词挤在同一个时间戳上，说明这句没对齐上，整批跳过 */
      var seen = {};
      tk.forEach(function(t){
        if (typeof t.s === 'number' && typeof t.e === 'number'){
          var k = t.s.toFixed(2) + '/' + t.e.toFixed(2); seen[k] = (seen[k] || 0) + 1;
        }
      });
      tk.forEach(function(t, ti){
        if (ti < (ln.skip || 0)) return;       /* "News Report 1" 这种标题不算词 */
        if (typeof t.s === 'number' && typeof t.e === 'number'
            && seen[t.s.toFixed(2) + '/' + t.e.toFixed(2)] > 1) return;
        var w = normTok(t.w);
        if (w.length < 5 || w.length > 14) return;
        if (w.indexOf("'") >= 0) return;      /* that's / don't 这类缩写，做闪卡没意义 */
        if (STOP[w]) return;
        if (typeof t.s !== 'number' || typeof t.e !== 'number') return;
        if (t.q === 0) return;               /* 时间没对齐上，宁可不用 */
        var d = t.e - t.s;
        if (d <= 0.05) return;
        if (!map[w]) map[w] = { w:w, n:0, occ:[] };
        map[w].n++;
        map[w].occ.push({ s:t.s, e:t.e, li:li, d:d, ti:ti });
      });
    });
    var arr = Object.keys(map).map(function(k){
      var it = map[k];
      /* 挑最清楚的那一次出现：太短是含混带过，太长是裹了静音 */
      var best = null, bd = 1e9;
      it.occ.forEach(function(o){
        if (o.d < WMIN || o.d > WMAX) return;
        var sc = Math.abs(o.d - 0.45) + Math.min((lines[o.li].tokens || []).length, 40) * 0.004;
        if (sc < bd){ bd = sc; best = o; }
      });
      if (!best){ it.occ.forEach(function(o){ if (!best || o.d > best.d) best = o; }); }
      it.best = best;
      it.li0 = best.li;
      it.score = it.n * 2.2 + Math.min(it.w.length, 10) * 0.55
               + Math.min((lines[best.li].tokens || []).length, 30) * 0.06
               + (best.d >= WMIN ? 0 : -4);
      return it;
    }).filter(function(x){ return !!x.best; });
    arr.sort(function(a, b){ return b.score - a.score; });

    /* 分散取样：按句序分桶，避免 20 个词全挤在开头三段 */
    var picked = [], N = want, band = Math.max(1, Math.ceil(lines.length / N));
    var buckets = {};
    arr.forEach(function(x){
      var b = Math.floor(x.li0 / band);
      if (!buckets[b]) buckets[b] = [];
      buckets[b].push(x);
    });
    var keys = Object.keys(buckets).map(Number).sort(function(a, b){ return a - b; });
    var round = 0;
    while (picked.length < N && round < 6){
      var added = false;
      for (var i = 0; i < keys.length && picked.length < N; i++){
        var b = buckets[keys[i]];
        if (b && b.length > round){ picked.push(b[round]); added = true; }
      }
      if (!added) break;
      round++;
    }
    if (picked.length < N){
      for (var j = 0; j < arr.length && picked.length < N; j++){
        if (picked.indexOf(arr[j]) < 0) picked.push(arr[j]);
      }
    }
    return picked.slice(0, N).map(function(x){
      var b = x.best, ln = lines[b.li], tk = ln.tokens || [];
      var ns = tk.length ? tk[0].s : b.s;
      var ne = tk.length ? tk[tk.length - 1].e : b.e;
      return { w:x.w, en:ln.en, cn:ln.cn || '', s:b.s, e:b.e, ns:ns, ne:ne, tk:tk, ti:b.ti };
    });
  }

  function start(list){
    if (!list.length) return;
    unlock();
    deck = list.slice(); idx = 0; ok = 0; wrong = [];
    document.getElementById('done').classList.remove('on');
    document.getElementById('card').style.display = 'flex';
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('rate').textContent = '0%';
    show();
  }

  function show(){
    if (idx >= deck.length){ finish(); return; }
    revealed = false; running = true;
    var it = deck[idx];
    document.getElementById('page').textContent = (idx + 1) + ' / ' + deck.length;
    document.getElementById('ask').style.display = 'block';
    document.getElementById('answer').classList.remove('on');
    document.getElementById('acts').style.display = 'flex';
    document.getElementById('btnNext').style.display = 'none';
    document.getElementById('bar').style.width = '0%';
    document.getElementById('word').textContent = '—';
    document.getElementById('sent').textContent = '';
    document.getElementById('cn').textContent = '';
    document.getElementById('sec').textContent = '3';
    document.getElementById('state').textContent = '听音 → 说中文';
    playClip(it);
    countdown();
  }

  function countdown(){
    clearInterval(timer);
    deadline = Date.now() + 3000;
    timer = setInterval(function(){
      var left = Math.max(0, deadline - Date.now());
      var pct = 100 - (left / 3000 * 100);
      document.getElementById('bar').style.width = Math.min(100, pct) + '%';
      document.getElementById('sec').textContent = Math.ceil(left / 1000);
      if (left <= 0){ clearInterval(timer); reveal(false); }
    }, 80);
  }

  function reveal(good){
    if (revealed) return;
    revealed = true; running = false;
    clearInterval(timer);
    document.getElementById('bar').style.width = '100%';
    var it = deck[idx];
    if (good === true) ok++;
    else wrong.push(it);

    var sentHTML;
    if (it.tk && it.tk.length){
      /* 只高亮真正播的那一处，不把同句里同样的词全标上 */
      sentHTML = it.tk.map(function(t, i){
        return i === it.ti ? '<b>' + esc(t.w) + '</b>' : esc(t.w);
      }).join(' ');
    } else {
      var rx = new RegExp('\\b(' + it.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'ig');
      sentHTML = esc(it.en).replace(rx, '<b>$1</b>');
    }
    document.getElementById('word').textContent = it.w;
    document.getElementById('sent').innerHTML = sentHTML;
    document.getElementById('cn').textContent = it.cn || '';
    document.getElementById('answer').classList.add('on');
    document.getElementById('acts').style.display = 'none';
    document.getElementById('btnNext').style.display = 'block';
    document.getElementById('state').textContent = good ? '记住了' : '没反应';
    document.getElementById('ask').style.display = 'none';
  }

  function next(){
    idx++;
    if (idx >= deck.length){ finish(); return; }
    show();
  }

  function finish(){
    running = false;
    clearInterval(timer);
    var n = deck.length, rate = n ? Math.round(ok / n * 100) : 0;
    document.getElementById('rate').textContent = rate + '%';
    document.getElementById('rateSub').textContent = '这轮 ' + n + ' 个词，' + ok + ' 个在 3 秒内说出来';
    var box = document.getElementById('wrongList');
    if (!wrong.length){
      box.innerHTML = '<div style="text-align:center;color:var(--sub)">这一轮全过，换一段或明天再来。</div>';
    } else {
      box.innerHTML = wrong.map(function(x, i){
        return '<div>' + esc(x.w) + '<button data-i="' + i + '">听原声</button>'
             + '<span>' + esc(x.cn || x.en) + '</span></div>';
      }).join('');
    }
    document.getElementById('card').style.display = 'none';
    document.getElementById('done').classList.add('on');
    document.getElementById('btnStart').style.display = 'none';

    try{
      var K = 'cet4_sound_v1';
      var allr = JSON.parse(localStorage.getItem(K) || '{}') || {};
      var d = new Date();
      var ymd = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      allr[page] = { at: Date.now(), day: ymd, total: n, ok: ok,
                     wrong: wrong.map(function(x){ return x.w; }) };
      localStorage.setItem(K, JSON.stringify(allr));
    }catch(e){}

    /* 回传给首页：这一步做完了 */
    try{
      if (SKEY){
        var sd = new Date();
        var sy = sd.getFullYear() + '-' + String(sd.getMonth() + 1).padStart(2, '0') + '-' + String(sd.getDate()).padStart(2, '0');
        var so = JSON.parse(localStorage.getItem('cet4_steps_' + sy) || '{}') || {};
        so[SKEY] = 1;
        localStorage.setItem('cet4_steps_' + sy, JSON.stringify(so));
      }
    }catch(e){}
  }

  document.getElementById('btnOk').addEventListener('click', function(){ reveal(true); });
  document.getElementById('btnNo').addEventListener('click', function(){ reveal(false); });
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('play').addEventListener('click', function(){ if (running && deck[idx]) playClip(deck[idx]); });
  document.getElementById('play2').addEventListener('click', function(){ if (deck[idx]) playClip(deck[idx]); });
  document.getElementById('playSent').addEventListener('click', function(){ if (deck[idx]) playClip(deck[idx], true); });
  document.getElementById('word').addEventListener('click', function(){ if (deck[idx]) playClip(deck[idx]); });
  document.getElementById('againAll').addEventListener('click', function(){ start(all); });
  document.getElementById('againWrong').addEventListener('click', function(){
    if (!wrong.length) return;
    start(wrong.slice());
  });
  document.getElementById('wrongList').addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]');
    if (b){
      var it = wrong[+b.getAttribute('data-i')];
      if (it) playClip(it);
    }
  });

  document.getElementById('btnStart').addEventListener('click', function(){ start(all); });

  fetch(page, { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(html){
    var D = parseDATA(html);
    var lines = [];
    if (D && D.lines && D.lines.length){
      DATA = D;
      var r0 = (D.rates && D.rates[0]) || null;
      SRC = (r0 && r0.src) ? r0.src : '';
      D.lines.forEach(function(ln){
        var tk = ln.tokens || [];
        if (!tk.length) return;
        var en = tk.map(function(t){ return t.w; }).join(' ').replace(/\s+/g, ' ').trim();
        lines.push({ en:en, cn:(ln.zh || '').trim(), tokens:tk, skip:headSkip(tk) });
      });
      lines = lines.filter(function(x){ return x.en.length > 12; });
    }
    if (!lines.length) throw new Error('没找到原文句子');
    all = build(lines);
    if (!all.length) throw new Error('这段没抽出可用词');

    document.getElementById('page').textContent = '0 / ' + all.length;

    var bs = document.getElementById('btnStart');
    if (SRC){
      AU.src = SRC;
      try{ AU.load(); }catch(e){}
      document.getElementById('src').textContent = page.replace(/\.html$/, '').replace(/_/g, ' ') + ' · 原声';
      document.querySelector('.hint').innerHTML = '听真题原声，<b>3 秒内</b>说出中文。想不起来就点「没反应」，别硬想。';

      /* 音频没缓冲好就先别让点，免得第一声是空的 */
      var ready = function(){
        bs.disabled = false;
        bs.textContent = '开始（' + all.length + ' 个词）';
      };
      bs.textContent = '准备原声中…';
      bs.disabled = true;
      if (AU.readyState >= 3) ready();
      else {
        AU.addEventListener('canplay', ready, { once:true });
        setTimeout(ready, 8000);
      }
    } else {
      bs.disabled = false;
      bs.textContent = '开始（' + all.length + ' 个词）';
      document.getElementById('src').textContent = page.replace(/\.html$/, '').replace(/_/g, ' ') + ' · 系统语音';
      document.querySelector('.hint').innerHTML = '听发音，<b>3 秒内</b>说出中文。想不起来就点「没反应」，别硬想。';
    }
  }).catch(function(e){
    document.getElementById('src').textContent = '加载失败：' + e.message;
    document.getElementById('btnStart').disabled = true;
  });
})();
</script>
</body>
</html>
